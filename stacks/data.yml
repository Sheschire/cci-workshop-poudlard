---
# =============================================================================
# Dockerwarts N°1 — data stack: the three stateful clusters.
#
#   scripts/deploy.sh data             (make deploy-data)
#
# Contents
#   galera-1/2/3   MariaDB 11.4 Galera, synchronous multi-master  (ADR-0005)
#   db-proxy       HAProxy, single-writer front end               (ADR-0005)
#   cassandra-1/2/3  Cassandra 5.0 datalake, RF=3
#   es-1/2/3       Elasticsearch 8, logs + business data          (ADR-0007)
#   kibana         log exploration
#   fluent-bit     global log collector
#
# The Swarm modelling of a stateful cluster (ADR-0001)
# ----------------------------------------------------
# Swarm has no StatefulSet. A 3-replica service would give three interchangeable
# tasks with no stable identity and no stable storage — which is meaningless for
# a database. So each member is a SEPARATE service, pinned to one node by a
# label, with its own LOCAL named volume. That gives exactly what a StatefulSet
# gives: stable name, stable placement, stable storage.
#
# No database volume is ever on NFS. NFS is used only for the GLPI files
# (ADR-0006); a database on NFS would be both slow and unsafe.
#
# Documented in docs/04-composants/{galera,cassandra,elasticsearch,kibana,fluent-bit}.md
# =============================================================================
version: "3.8"

# --- Anchors -----------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  condition: on-failure
  delay: 10s
  max_attempts: 0

# CDC §6.4 hardening, applied to every service.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# A stateful member is updated one at a time and STOP-FIRST: two instances of
# the same member must never hold the same data directory, and `start-first`
# would try exactly that.
x-stateful-update: &stateful-update
  parallelism: 1
  order: stop-first
  failure_action: rollback
  delay: 30s

services:

  # ===========================================================================
  # MariaDB Galera — galera-1 / galera-2 / galera-3
  #
  # Synchronous multi-master replication: a transaction is certified by every
  # node before the client is acknowledged, so a committed write exists on
  # three machines (RPO = 0, CDC §N2). Quorum is 2 of 3 — the cluster survives
  # the loss of one node and refuses writes if it loses two, which is the
  # correct behaviour (accepting writes without quorum would split the data).
  # ===========================================================================
  galera-1:
    image: mariadb:11.4.13@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
    <<: *hardening
    # NOT read_only: MariaDB writes its data directory, its logs and its
    # rendered configuration. Every one of those is a volume or a tmpfs, but
    # the entrypoint also writes /etc/mysql/conf.d, which is part of the image
    # layer. The image runs as the `mysql` user already (uid 999).
    entrypoint: ["/usr/local/bin/galera-entrypoint.sh"]
    environment:
      WSREP_NODE_NAME: galera-1
      # The Swarm service name, not a container IP: it survives rescheduling.
      WSREP_NODE_ADDRESS: galera-1
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/dw_mariadb_root_password
      MARIADB_SST_PASSWORD_FILE: /run/secrets/dw_mariadb_sst_password
      MARIADB_GLPI_PASSWORD_FILE: /run/secrets/dw_mariadb_glpi_password
      MARIADB_GRAFANA_PASSWORD_FILE: /run/secrets/dw_mariadb_grafana_password
      MARIADB_EXPORTER_PASSWORD_FILE: /run/secrets/dw_mariadb_exporter_password
      MARIADB_BACKUP_PASSWORD_FILE: /run/secrets/dw_mariadb_backup_password
      # Set to 1 by scripts/galera-bootstrap.sh for the very first start and by
      # scripts/galera-recover.sh after a full cluster stop. NEVER on more than
      # one member at a time: two would form two independent clusters.
      GALERA_BOOTSTRAP: "${GALERA_BOOTSTRAP_1:-0}"
      TZ: "${TZ}"
    volumes:
      - type: volume
        source: galera_data_1
        target: /var/lib/mysql
      - type: volume
        source: galera_logs_1
        target: /var/log/mysql
    configs:
      - source: galera_entrypoint
        target: /usr/local/bin/galera-entrypoint.sh
        mode: 365            # 0555: readable and executable, never writable
      - source: galera_cnf
        target: /etc/mysql/templates/galera.cnf.tpl
        mode: 292            # 0444
      # Only galera-1 receives the initialisation SQL: the image runs
      # /docker-entrypoint-initdb.d only on an empty data directory, and
      # members 2 and 3 arrive by SST, never through initdb.
      - source: galera_init
        target: /etc/mysql/templates/init.sql.tpl
        mode: 292
    secrets:
      - dw_mariadb_root_password
      - dw_mariadb_sst_password
      - dw_mariadb_glpi_password
      - dw_mariadb_grafana_password
      - dw_mariadb_exporter_password
      - dw_mariadb_backup_password
    networks:
      - data
    healthcheck:
      # `wsrep_ready` and not just "is the port open": a node performing an SST
      # accepts connections and answers nothing useful. This asks the only
      # question that matters — can this node serve queries as part of the
      # cluster?
      test:
        - CMD-SHELL
        - >-
          mariadb -u root -p"$$(cat /run/secrets/dw_mariadb_root_password)"
          -N -B -e "SHOW STATUS LIKE 'wsrep_ready'" 2>/dev/null | grep -q ON
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s     # an SST of a large dataset takes minutes
    stop_grace_period: 60s
    # A Galera node killed rather than stopped leaves a dirty grastate.dat and
    # needs a full SST on its next start. 60 s is ample for a clean shutdown.
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.galera == 1
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 768M
      restart_policy: *default-restart
      update_config: *stateful-update
    logging: *default-logging

  galera-2:
    image: mariadb:11.4.13@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
    <<: *hardening
    entrypoint: ["/usr/local/bin/galera-entrypoint.sh"]
    environment:
      WSREP_NODE_NAME: galera-2
      WSREP_NODE_ADDRESS: galera-2
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/dw_mariadb_root_password
      MARIADB_SST_PASSWORD_FILE: /run/secrets/dw_mariadb_sst_password
      GALERA_BOOTSTRAP: "0"
      TZ: "${TZ}"
    volumes:
      - type: volume
        source: galera_data_2
        target: /var/lib/mysql
      - type: volume
        source: galera_logs_2
        target: /var/log/mysql
    configs:
      - source: galera_entrypoint
        target: /usr/local/bin/galera-entrypoint.sh
        mode: 365
      - source: galera_cnf
        target: /etc/mysql/templates/galera.cnf.tpl
        mode: 292
    secrets:
      - dw_mariadb_root_password
      - dw_mariadb_sst_password
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mariadb -u root -p"$$(cat /run/secrets/dw_mariadb_root_password)"
          -N -B -e "SHOW STATUS LIKE 'wsrep_ready'" 2>/dev/null | grep -q ON
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    stop_grace_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.galera == 2
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 768M
      restart_policy: *default-restart
      update_config: *stateful-update
    logging: *default-logging

  galera-3:
    image: mariadb:11.4.13@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
    <<: *hardening
    entrypoint: ["/usr/local/bin/galera-entrypoint.sh"]
    environment:
      WSREP_NODE_NAME: galera-3
      WSREP_NODE_ADDRESS: galera-3
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/dw_mariadb_root_password
      MARIADB_SST_PASSWORD_FILE: /run/secrets/dw_mariadb_sst_password
      GALERA_BOOTSTRAP: "0"
      TZ: "${TZ}"
    volumes:
      - type: volume
        source: galera_data_3
        target: /var/lib/mysql
      - type: volume
        source: galera_logs_3
        target: /var/log/mysql
    configs:
      - source: galera_entrypoint
        target: /usr/local/bin/galera-entrypoint.sh
        mode: 365
      - source: galera_cnf
        target: /etc/mysql/templates/galera.cnf.tpl
        mode: 292
    secrets:
      - dw_mariadb_root_password
      - dw_mariadb_sst_password
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mariadb -u root -p"$$(cat /run/secrets/dw_mariadb_root_password)"
          -N -B -e "SHOW STATUS LIKE 'wsrep_ready'" 2>/dev/null | grep -q ON
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    stop_grace_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.galera == 3
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 768M
      restart_policy: *default-restart
      update_config: *stateful-update
    logging: *default-logging

  # ===========================================================================
  # db-proxy — HAProxy, the single-writer front end (ADR-0005)
  #
  # Galera would accept writes on all three nodes, but concurrent writes to the
  # same rows from different nodes fail certification and surface to the client
  # as a deadlock. GLPI does not retry those. Routing every connection to ONE
  # node removes the problem without giving up availability: HAProxy fails over
  # deterministically in under 5 s.
  #
  # 2 replicas, one per node, so the proxy itself is not a single point of
  # failure. Both replicas use the SAME server order, so they always agree on
  # who the writer is.
  # ===========================================================================
  db-proxy:
    image: haproxy:2.9.15@sha256:81506628494800519f82caf4128cb693df21ee5f38fca467224fcff508d537de
    <<: *hardening
    # HAProxy listens on 3306 and 8404, both above 1024, and writes nothing
    # outside /var/lib/haproxy (a tmpfs here).
    read_only: true
    tmpfs:
      - /var/lib/haproxy:size=16M
      - /tmp:size=16M
    user: "99:99"      # the `haproxy` user of the official image
    configs:
      - source: haproxy_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 292
    networks:
      - data          # to reach galera-1/2/3
      - monitoring    # so Prometheus can scrape :8404/metrics
    healthcheck:
      # `monitor-uri /healthz` on the stats frontend: proves the process is
      # alive AND that it parsed its configuration.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8404/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
      restart_policy: *default-restart
      update_config:
        parallelism: 1
        order: start-first     # stateless: a new task can come up first
        failure_action: rollback
        delay: 10s
      labels:
        prometheus.job: "haproxy"
        prometheus.port: "8404"
    logging: *default-logging

  # ===========================================================================
  # Cassandra — cassandra-1 / cassandra-2 / cassandra-3
  #
  # RF=3 with LOCAL_QUORUM: a write is acknowledged by 2 of 3 replicas, so it
  # survives the loss of any one node (RPO = 0). Reads at the same level always
  # see the latest acknowledged write (R + W > N: 2 + 2 > 3).
  #
  # Seeds are cassandra-1 and cassandra-2 (never all three): a seed does not
  # bootstrap through the normal gossip path, and making every node a seed is a
  # documented way to end up with an inconsistent ring.
  # ===========================================================================
  cassandra-1: &cassandra-base
    image: ${REGISTRY}/dockerwarts/cassandra:${IMAGE_TAG}
    <<: *hardening
    environment: &cassandra-env
      CASSANDRA_CLUSTER_NAME: dockerwarts
      CASSANDRA_SEEDS: "cassandra-1,cassandra-2"
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      # Gossiping and not SimpleSnitch: it reads the rack/DC from a file, which
      # is what makes NetworkTopologyStrategy (config/cassandra/init.cql)
      # meaningful and what a second datacentre would build on.
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_BROADCAST_ADDRESS: cassandra-1
      CASSANDRA_LISTEN_ADDRESS: cassandra-1
      CASSANDRA_RPC_ADDRESS: "0.0.0.0"
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-1
      MAX_HEAP_SIZE: "${CASSANDRA_HEAP}"
      HEAP_NEWSIZE: "${CASSANDRA_NEWSIZE}"
      # The in-JVM Prometheus agent (images/cassandra/Dockerfile) plus JMX
      # authentication for remote `nodetool`, used by the backup jobs.
      JVM_OPTS: >-
        -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7070:/etc/cassandra/jmx-exporter.yml
        -Dcom.sun.management.jmxremote.authenticate=true
        -Dcom.sun.management.jmxremote.password.file=/run/secrets/dw_cassandra_jmx_password
        -Dcom.sun.management.jmxremote.access.file=/run/secrets/dw_cassandra_jmx_access
      TZ: "${TZ}"
    volumes:
      - type: volume
        source: cassandra_data_1
        target: /var/lib/cassandra
    configs:
      - source: cassandra_jmx
        target: /etc/cassandra/jmx-exporter.yml
        mode: 292
    secrets:
      - source: dw_cassandra_jmx_password
        # The JVM REFUSES to start if the JMX password file is group- or
        # world-readable. 0400 is not a preference, it is a requirement.
        mode: 256          # 0400
      - source: dw_cassandra_jmx_access
        mode: 256
    networks:
      - data
    healthcheck:
      # "at least one node reported UN (Up/Normal) by this node's view".
      test:
        - CMD-SHELL
        - "nodetool status 2>/dev/null | awk '$$1 == \"UN\" { f=1 } END { exit f ? 0 : 1 }'"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 240s    # Cassandra is genuinely slow to start
    stop_grace_period: 120s
    # `nodetool drain` equivalent: Cassandra flushes its memtables on SIGTERM.
    # Killing it instead means replaying the commit log on the next start,
    # which is slow and, on a full disk, can fail.
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cassandra == 1
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G
      restart_policy: *default-restart
      update_config: *stateful-update
      labels:
        prometheus.job: "cassandra"
        prometheus.port: "7070"
    logging: *default-logging

  cassandra-2:
    <<: *cassandra-base
    environment:
      <<: *cassandra-env
      CASSANDRA_RACK: rack2
      CASSANDRA_BROADCAST_ADDRESS: cassandra-2
      CASSANDRA_LISTEN_ADDRESS: cassandra-2
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-2
    volumes:
      - type: volume
        source: cassandra_data_2
        target: /var/lib/cassandra
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cassandra == 2
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G
      restart_policy: *default-restart
      update_config: *stateful-update
      labels:
        prometheus.job: "cassandra"
        prometheus.port: "7070"

  cassandra-3:
    <<: *cassandra-base
    environment:
      <<: *cassandra-env
      CASSANDRA_RACK: rack3
      CASSANDRA_BROADCAST_ADDRESS: cassandra-3
      CASSANDRA_LISTEN_ADDRESS: cassandra-3
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-3
    volumes:
      - type: volume
        source: cassandra_data_3
        target: /var/lib/cassandra
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.cassandra == 3
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G
      restart_policy: *default-restart
      update_config: *stateful-update
      labels:
        prometheus.job: "cassandra"
        prometheus.port: "7070"

  # ===========================================================================
  # Elasticsearch — es-1 / es-2 / es-3
  #
  # All three are master-eligible: quorum 2 of 3. Transport TLS is mandatory
  # and is also the authentication boundary — a node without a certificate
  # signed by the cluster CA cannot join (ADR-0007).
  # ===========================================================================
  es-1: &es-base
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    # NOTE: pinned by tag only. The digest could not be resolved during
    # development (docker.elastic.co refused by the egress policy). Complete
    # the pin with `scripts/pin-digests.sh --write` from a cluster node — see
    # docs/04-composants/versions.md.
    <<: *hardening
    environment: &es-env
      ES_NODE_NAME: es-1
      ES_JAVA_OPTS: "-Xms${ES_HEAP} -Xmx${ES_HEAP}"
      # Xms == Xmx: a JVM that grows its heap pauses to do so, and on a data
      # node those pauses look like a node failure to the cluster.
      ELASTIC_PASSWORD_FILE: /run/secrets/dw_es_elastic_password
      TZ: "${TZ}"
    volumes:
      - type: volume
        source: es_data_1
        target: /usr/share/elasticsearch/data
    configs:
      - source: es_config
        target: /usr/share/elasticsearch/config/elasticsearch.yml
        mode: 292
    secrets:
      - source: dw_es_ca
        target: /usr/share/elasticsearch/config/certs/ca.crt
        mode: 292
      - source: dw_es_cert_1
        target: /usr/share/elasticsearch/config/certs/node.crt
        mode: 292
      - source: dw_es_key_1
        target: /usr/share/elasticsearch/config/certs/node.key
        mode: 256          # 0400: a private key
      - dw_es_elastic_password
    networks:
      - data
    ulimits:
      # `bootstrap.memory_lock: true` in elasticsearch.yml needs an unlimited
      # memlock, or the node refuses to start.
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # The node's own health, not the cluster's: a single node reporting
      # `red` for the cluster is still a healthy node, and restarting it would
      # make things worse.
      test:
        - CMD-SHELL
        - >-
          curl -s -u "elastic:$$(cat /run/secrets/dw_es_elastic_password)"
          http://localhost:9200/_cat/health?h=status | grep -qE 'green|yellow'
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 180s
    stop_grace_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.es == 1
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
          # ~2x the heap: the JVM also needs off-heap memory for Lucene's
          # memory-mapped segments, which is where most search work happens.
        reservations:
          cpus: "0.25"
          memory: 1G
      restart_policy: *default-restart
      update_config: *stateful-update
    logging: *default-logging

  es-2:
    <<: *es-base
    environment:
      <<: *es-env
      ES_NODE_NAME: es-2
    volumes:
      - type: volume
        source: es_data_2
        target: /usr/share/elasticsearch/data
    secrets:
      - source: dw_es_ca
        target: /usr/share/elasticsearch/config/certs/ca.crt
        mode: 292
      - source: dw_es_cert_2
        target: /usr/share/elasticsearch/config/certs/node.crt
        mode: 292
      - source: dw_es_key_2
        target: /usr/share/elasticsearch/config/certs/node.key
        mode: 256
      - dw_es_elastic_password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.es == 2
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G
      restart_policy: *default-restart
      update_config: *stateful-update

  es-3:
    <<: *es-base
    environment:
      <<: *es-env
      ES_NODE_NAME: es-3
    volumes:
      - type: volume
        source: es_data_3
        target: /usr/share/elasticsearch/data
    secrets:
      - source: dw_es_ca
        target: /usr/share/elasticsearch/config/certs/ca.crt
        mode: 292
      - source: dw_es_cert_3
        target: /usr/share/elasticsearch/config/certs/node.crt
        mode: 292
      - source: dw_es_key_3
        target: /usr/share/elasticsearch/config/certs/node.key
        mode: 256
      - dw_es_elastic_password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.es == 3
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G
      restart_policy: *default-restart
      update_config: *stateful-update

  # ===========================================================================
  # Kibana — log exploration (ADR-0007)
  #
  # 1 floating replica: it is a stateless UI whose saved objects live in
  # Elasticsearch, so Swarm can reschedule it anywhere. Losing it costs a
  # 30-60 s reschedule and a re-login, which is well inside the CDC §9.4 RTO.
  # ===========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.21
    # NOTE: pinned by tag only — see the note on es-1.
    <<: *hardening
    # The generic Docker-secret → environment bridge (config/common/): Kibana
    # has no `*_FILE` convention of its own, so without this the password would
    # have to live in the Swarm config object, readable on any manager.
    entrypoint:
      - /usr/local/bin/secrets-entrypoint.sh
      - /usr/local/bin/kibana-docker
    environment:
      ELASTICSEARCH_PASSWORD_FILE: /run/secrets/dw_es_kibana_password
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY_FILE: /run/secrets/dw_kibana_encryption_key
      XPACK_SECURITY_ENCRYPTIONKEY_FILE: /run/secrets/dw_kibana_encryption_key
      XPACK_REPORTING_ENCRYPTIONKEY_FILE: /run/secrets/dw_kibana_encryption_key
      TZ: "${TZ}"
    configs:
      - source: secrets_entrypoint
        target: /usr/local/bin/secrets-entrypoint.sh
        mode: 365
      - source: kibana_config
        target: /usr/share/kibana/config/kibana.yml
        mode: 292
    secrets:
      - dw_es_kibana_password
      - dw_kibana_encryption_key
    networks:
      - data     # to reach es-1/2/3
      - edge     # so Traefik can route to it
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.10"
          memory: 256M
      restart_policy: *default-restart
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      labels:
        traefik.enable: "true"
        traefik.swarm.network: "edge"
        traefik.http.routers.kibana.rule: "Host(`kibana.${DOMAIN}`)"
        traefik.http.routers.kibana.entrypoints: "websecure"
        traefik.http.routers.kibana.tls: "true"
        traefik.http.routers.kibana.tls.options: "modern@file"
        # allowlist + rate-limit, but no basic-auth: Kibana authenticates its
        # own users against Elasticsearch.
        traefik.http.routers.kibana.middlewares: "admin-chain-noauth@file"
        traefik.http.routers.kibana.service: "kibana"
        traefik.http.services.kibana.loadbalancer.server.port: "5601"
    logging: *default-logging

  # ===========================================================================
  # Fluent Bit — log collection, one task per node (ADR-0007)
  #
  # Tails the json-file logs Docker writes, plus the Traefik access log and the
  # systemd journal. Never the `fluentd` log driver: that would make container
  # stdout writes block when the collector is down.
  # ===========================================================================
  fluent-bit:
    image: fluent/fluent-bit:3.2.10@sha256:d6dec000c4929a439562525728c708f6e99800d7ddc82efd6aa4f45f3a20b562
    <<: *hardening
    entrypoint:
      - /usr/local/bin/secrets-entrypoint.sh
      - /fluent-bit/bin/fluent-bit
      - --config=/fluent-bit/etc/fluent-bit.conf
    environment:
      ES_FLUENTBIT_PASSWORD_FILE: /run/secrets/dw_es_fluentbit_password
      # Swarm expands this template to the hostname of the node running the
      # task: it is what puts a `node_name` on every log line.
      NODE_NAME: "{{.Node.Hostname}}"
      TZ: "${TZ}"
    volumes:
      # Everything read is READ-ONLY. A log collector must never be able to
      # modify what it collects.
      - type: bind
        source: /var/lib/docker/containers
        target: /var/lib/docker/containers
        read_only: true
      - type: bind
        source: /var/log/traefik
        target: /var/log/traefik
        read_only: true
      - type: bind
        source: /var/log/journal
        target: /var/log/journal
        read_only: true
      # The one writable path: tail positions and the filesystem buffer. This
      # is what makes an Elasticsearch outage lossless rather than lossy.
      - type: volume
        source: fluentbit_state
        target: /var/log/flb-storage
    configs:
      - source: secrets_entrypoint
        target: /usr/local/bin/secrets-entrypoint.sh
        mode: 365
      - source: fluentbit_conf
        target: /fluent-bit/etc/fluent-bit.conf
        mode: 292
      - source: fluentbit_parsers
        target: /fluent-bit/etc/parsers.conf
        mode: 292
      - source: fluentbit_lua
        target: /fluent-bit/etc/docker-metadata.lua
        mode: 292
    secrets:
      - dw_es_fluentbit_password
    networks:
      - data          # to reach es-1
      - monitoring    # so Prometheus can scrape :2020
    healthcheck:
      # `Health_Check On` in the SERVICE section makes /api/v1/health reflect
      # output errors, not just liveness: a Fluent Bit that runs but cannot
      # deliver is reported unhealthy.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:2020/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
      restart_policy: *default-restart
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      labels:
        prometheus.job: "fluentbit"
        prometheus.port: "2020"
        prometheus.path: "/api/v1/metrics/prometheus"
    logging: *default-logging

# =============================================================================
# Configs — content-hashed names (CDC §10.2): editing a file and redeploying
# rolls the services. Swarm configs are immutable, so without the hash an edit
# would silently do nothing.
# =============================================================================
configs:
  galera_entrypoint:
    name: "galera_entrypoint-${CONFIG_HASH_GALERA_ENTRYPOINT}"
    file: ../config/galera/entrypoint.sh
  galera_cnf:
    name: "galera_cnf-${CONFIG_HASH_GALERA_CNF}"
    file: ../config/galera/galera.cnf
  galera_init:
    name: "galera_init-${CONFIG_HASH_GALERA_INIT}"
    file: ../config/galera/init.sql
  haproxy_cfg:
    name: "haproxy_cfg-${CONFIG_HASH_HAPROXY}"
    file: ../.rendered/haproxy.cfg
  cassandra_jmx:
    name: "cassandra_jmx-${CONFIG_HASH_CASSANDRA_JMX}"
    file: ../config/cassandra/jmx-exporter.yml
  es_config:
    name: "es_config-${CONFIG_HASH_ES_CONFIG}"
    file: ../.rendered/elasticsearch.yml
  kibana_config:
    name: "kibana_config-${CONFIG_HASH_KIBANA}"
    file: ../.rendered/kibana.yml
  fluentbit_conf:
    name: "fluentbit_conf-${CONFIG_HASH_FLUENTBIT_CONF}"
    file: ../.rendered/fluent-bit.conf
  fluentbit_parsers:
    name: "fluentbit_parsers-${CONFIG_HASH_FLUENTBIT_PARSERS}"
    file: ../config/fluent-bit/parsers.conf
  fluentbit_lua:
    name: "fluentbit_lua-${CONFIG_HASH_FLUENTBIT_LUA}"
    file: ../config/fluent-bit/docker-metadata.lua
  secrets_entrypoint:
    name: "secrets_entrypoint-${CONFIG_HASH_SECRETS_ENTRYPOINT}"
    file: ../config/common/secrets-entrypoint.sh

secrets:
  dw_mariadb_root_password:
    external: true
  dw_mariadb_sst_password:
    external: true
  dw_mariadb_glpi_password:
    external: true
  dw_mariadb_grafana_password:
    external: true
  dw_mariadb_exporter_password:
    external: true
  dw_mariadb_backup_password:
    external: true
  dw_cassandra_jmx_password:
    external: true
  dw_cassandra_jmx_access:
    external: true
  dw_es_ca:
    external: true
  dw_es_cert_1:
    external: true
  dw_es_key_1:
    external: true
  dw_es_cert_2:
    external: true
  dw_es_key_2:
    external: true
  dw_es_cert_3:
    external: true
  dw_es_key_3:
    external: true
  dw_es_elastic_password:
    external: true
  dw_es_kibana_password:
    external: true
  dw_es_fluentbit_password:
    external: true
  dw_kibana_encryption_key:
    external: true

# =============================================================================
# Volumes — ALL local, one per member, never on NFS (ADR-0006).
#
# A local volume is what pins a member's data to its node. Combined with the
# placement constraint, that is Swarm's equivalent of a StatefulSet's stable
# storage. Putting a database on NFS would be slower and, for Galera and
# Cassandra, actively unsafe (file locking).
# =============================================================================
volumes:
  galera_data_1: {driver: local}
  galera_data_2: {driver: local}
  galera_data_3: {driver: local}
  galera_logs_1: {driver: local}
  galera_logs_2: {driver: local}
  galera_logs_3: {driver: local}
  cassandra_data_1: {driver: local}
  cassandra_data_2: {driver: local}
  cassandra_data_3: {driver: local}
  es_data_1: {driver: local}
  es_data_2: {driver: local}
  es_data_3: {driver: local}
  fluentbit_state: {driver: local}

networks:
  data:
    external: true
  edge:
    external: true
  monitoring:
    external: true
