---
# =============================================================================
# Dockerwarts N°1 — edge stack: the platform's entry point and its application
# firewall.
#
#   scripts/deploy.sh edge            (make deploy-edge)
#
# Contents
#   docker-socket-proxy  read-only window on the Docker API (CDC §6.4)
#   traefik              global, host-mode reverse proxy (ADR-0003)
#   crowdsec-lapi        decision authority, pinned to node3
#   crowdsec-agent       global, reads each node's Traefik and system logs
#   whoami               TLS / routing / VIP validation service
#
# Keepalived is NOT here: it runs on the host (ADR-0003). The VIP follows the
# node whose local Traefik answers `/ping`.
#
# Documented in docs/04-composants/{traefik,crowdsec,keepalived}.md.
# =============================================================================
version: "3.8"

# --- Anchors -----------------------------------------------------------------
# Repeated blocks, defined once. `docker stack config` expands them, so the
# rendered file — and therefore the convention checks — see the real values.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  condition: on-failure
  delay: 5s
  max_attempts: 0

x-update: &default-update
  parallelism: 1
  order: start-first
  failure_action: rollback
  delay: 10s

# Container hardening required by CDC §6.4, applied to every service of every
# stack. `no-new-privileges` blocks setuid escalation inside the container;
# `cap_drop: [ALL]` starts from zero capabilities and each service adds back
# only what it provably needs (documented at the point of use).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  # ===========================================================================
  # docker-socket-proxy — the ONLY container that sees /var/run/docker.sock.
  #
  # Traefik and Prometheus both need to read the Swarm API to discover
  # services. Handing them the socket would hand them root on the host: the
  # Docker API can create a privileged container mounting `/`. This proxy
  # exposes a strict allow-list of read-only endpoints instead (CDC §6.4).
  #
  # A second, write-capable proxy (`docker-socket-proxy-rw`) exists in
  # stacks/backup.yml for swarm-cronjob alone.
  # ===========================================================================
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    <<: *hardening
    # HAProxy under the hood: it listens on 2375 (> 1024, so no
    # NET_BIND_SERVICE) and only reads the socket. Zero capabilities.
    read_only: true
    tmpfs:
      - /var/run:size=8M
      - /tmp:size=8M
    # Runs as root because /var/run/docker.sock is root:docker on the host and
    # the container has no matching supplementary group. It is the reason the
    # allow-list above is so narrow.
    environment:
      # --- allowed (read-only) ------------------------------------------------
      SERVICES: "1"     # Traefik: routers; Prometheus: dockerswarm_sd
      TASKS: "1"        # Traefik: task addresses; Prometheus: targets
      NETWORKS: "1"     # Traefik: which network to reach a task on
      NODES: "1"        # Prometheus: the `node` label
      INFO: "1"         # version negotiation
      VERSION: "1"
      # --- explicitly denied --------------------------------------------------
      # POST=0 makes the whole proxy read-only: no create, update, exec or
      # delete can pass, whatever the endpoint.
      POST: "0"
      CONTAINERS: "0"   # `docker ps` would leak env vars and mounts
      IMAGES: "0"
      VOLUMES: "0"
      SECRETS: "0"      # decisive: would expose every credential
      CONFIGS: "0"
      SWARM: "0"        # would expose the manager join token
      EXEC: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      PLUGINS: "0"
      SESSION: "0"
      SYSTEM: "0"
      LOG_LEVEL: warning
    volumes:
      # The documented exception of CDC §6.4, read-only, on this service only.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    networks:
      - mgmt
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      # Global: Traefik runs on every node and must reach a *local* proxy —
      # crossing the overlay for every API call would add latency and a
      # dependency on another node being up.
      mode: global
      placement:
        constraints:
          # Only a manager's socket exposes the Swarm API at all.
          - node.role == manager
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.01"
          memory: 16M
      restart_policy: *default-restart
      update_config: *default-update
    logging: *default-logging

  # ===========================================================================
  # Traefik — reverse proxy, TLS terminator, layer 2 of the firewall.
  #
  # `mode: global` + `ports.mode: host` (ADR-0003): every node listens on
  # 80/443 directly, so the real client IP survives. The Swarm routing mesh
  # would SNAT it and make CrowdSec's IP bans meaningless.
  # ===========================================================================
  traefik:
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    <<: *hardening
    # The ONE capability Traefik needs: binding 80 and 443, which are
    # privileged ports. Everything else is dropped.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      # Yaegi compiles the CrowdSec bouncer plugin here at start-up.
      - /tmp:size=64M
    command:
      # Everything else is in the static configuration file; only the plugin
      # cache directory has to be a flag because it is set before parsing.
      - "--configFile=/etc/traefik/traefik.yml"
    environment:
      TZ: "${TZ}"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      # Access log on a host bind mount: the CrowdSec agent of the same node
      # tails it, Fluent Bit ships it to `logs-traefik`, and logrotate
      # (Ansible, copytruncate) rotates it without breaking either reader.
      - type: bind
        source: /var/log/traefik
        target: /var/log/traefik
      # Plugin cache: Traefik compiles the CrowdSec bouncer at start-up.
      # A named volume avoids re-downloading it on every restart, which also
      # means a restart works with no Internet access.
      - type: volume
        source: traefik_plugins
        target: /plugins-storage
    configs:
      - source: traefik_static
        target: /etc/traefik/traefik.yml
        mode: 292               # 0444 in octal: read-only for everyone
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
        mode: 292               # 0444 in octal: read-only for everyone
    secrets:
      - dw_tls_cert
      - dw_tls_key
      - dw_traefik_htpasswd
      - dw_crowdsec_bouncer_key
    networks:
      - edge        # reaches the exposed application services
      - mgmt        # reaches docker-socket-proxy
      - crowdsec    # the bouncer plugin reaches the LAPI
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      mode: global
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      restart_policy: *default-restart
      update_config:
        parallelism: 1
        # `stop-first`: 80/443 are host ports, two tasks cannot bind them at
        # once. One node at a time updates; the VIP moves away from it because
        # its `/ping` fails, so the user sees nothing.
        order: stop-first
        failure_action: rollback
        delay: 15s
      labels:
        prometheus.job: "traefik"
        prometheus.port: "8082"
    logging: *default-logging

  # ===========================================================================
  # CrowdSec LAPI — the decision authority (layer 3, ADR-0004).
  #
  # Single replica pinned to node3, SQLite on a local volume. Its unavailability
  # does NOT lower the protection: the Traefik bouncer runs in `stream` mode and
  # keeps a local copy of the decision list.
  # ===========================================================================
  crowdsec-lapi:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    <<: *hardening
    # NOT read_only: the entrypoint materialises the hub (collections,
    # parsers, scenarios) under /etc/crowdsec and /var/lib/crowdsec at every
    # start, and both are named volumes. Root with zero capabilities is the
    # hardening this image allows.
    environment:
      # LAPI only: this instance takes decisions, it does not read logs.
      DISABLE_AGENT: "true"
      # Behavioural collections (CDC §6.3).
      COLLECTIONS: >-
        crowdsecurity/traefik
        crowdsecurity/http-cve
        crowdsecurity/base-http-scenarios
        crowdsecurity/sshd
        crowdsecurity/linux
      # The bouncer key is pre-registered so the Traefik plugin can authenticate
      # on its very first start, with no manual `cscli bouncers add`.
      BOUNCER_KEY_traefik_FILE: /run/secrets/dw_crowdsec_bouncer_key
      # Credentials the agents register with.
      AGENT_USERNAME: "dockerwarts-agent"
      AGENT_PASSWORD_FILE: /run/secrets/dw_crowdsec_agent_password
      # The community blocklist needs Internet access; when it is unavailable
      # CrowdSec keeps working on local scenarios alone.
      DISABLE_ONLINE_API: "false"
      TZ: "${TZ}"
    volumes:
      - type: volume
        source: crowdsec_data
        target: /var/lib/crowdsec/data
      - type: volume
        source: crowdsec_config
        target: /etc/crowdsec
    configs:
      - source: crowdsec_profiles
        target: /etc/crowdsec/profiles.yaml
        mode: 292               # 0444 in octal: read-only for everyone
    secrets:
      - dw_crowdsec_bouncer_key
      - dw_crowdsec_agent_password
    networks:
      - crowdsec     # agents and the Traefik bouncer
      - monitoring   # Prometheus scrapes :6060
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.crowdsec_lapi == true
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 128M
      restart_policy: *default-restart
      update_config:
        parallelism: 1
        order: stop-first     # SQLite: never two writers on one file
        failure_action: rollback
      labels:
        prometheus.job: "crowdsec"
        prometheus.port: "6060"
    logging: *default-logging

  # ===========================================================================
  # CrowdSec agents — one per node, read-only.
  #
  # Each agent parses ITS OWN node's Traefik access log plus the host auth and
  # kernel logs, and reports to the single LAPI. Three local views, one shared
  # decision list.
  # ===========================================================================
  crowdsec-agent:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    <<: *hardening
    # Same as the LAPI for read_only. Runs as root to read /var/log/auth.log
    # (0640 root:adm) — as the file owner, so no DAC_OVERRIDE is needed and
    # the capability set stays empty.
    environment:
      # Agent only: it detects, the LAPI decides.
      DISABLE_LOCAL_API: "true"
      LOCAL_API_URL: "http://crowdsec-lapi:8080"
      AGENT_USERNAME: "dockerwarts-agent"
      AGENT_PASSWORD_FILE: /run/secrets/dw_crowdsec_agent_password
      COLLECTIONS: >-
        crowdsecurity/traefik
        crowdsecurity/http-cve
        crowdsecurity/base-http-scenarios
        crowdsecurity/sshd
        crowdsecurity/linux
      TZ: "${TZ}"
    volumes:
      # Everything the agent reads is READ-ONLY: an agent must never be able to
      # alter the evidence it is parsing.
      - type: bind
        source: /var/log/traefik
        target: /var/log/traefik
        read_only: true
      - type: bind
        source: /var/log/auth.log
        target: /var/log/auth.log
        read_only: true
      - type: bind
        source: /var/log/kern.log
        target: /var/log/kern.log
        read_only: true
      # Parser state (file positions), so a restart does not re-detect the
      # whole log and re-ban everyone.
      - type: volume
        source: crowdsec_agent_data
        target: /var/lib/crowdsec/data
    configs:
      - source: crowdsec_acquis
        target: /etc/crowdsec/acquis.d/dockerwarts.yaml
        mode: 292               # 0444 in octal: read-only for everyone
    secrets:
      - dw_crowdsec_agent_password
    networks:
      - crowdsec
      - monitoring
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s      # waits for the LAPI to be registerable
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
      restart_policy: *default-restart
      update_config: *default-update
      labels:
        prometheus.job: "crowdsec-agent"
        prometheus.port: "6060"
    logging: *default-logging

  # ===========================================================================
  # whoami — the validation service (CDC §7.1).
  #
  # Echoes the request it received, including the source address. That is what
  # proves criterion 1.3: with `mode: host`, `RemoteAddr` is the real client,
  # not an overlay gateway.
  #
  # Kept behind `admin-allowlist`: it is a diagnostic tool, not a public page.
  # ===========================================================================
  whoami:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    <<: *hardening
    # A single static binary listening above 1024 and writing nothing: the
    # fully hardened case — non-root, read-only, no capabilities.
    user: "65534:65534"
    read_only: true
    command:
      - "--port=8080"
      - "--name=whoami"
    networks:
      - edge
    healthcheck:
      # The image is distroless-like: no wget, no curl. `whoami --help` exiting
      # 0 proves the binary and the filesystem are intact, which is all a
      # stateless echo server can meaningfully assert.
      test: ["CMD", "/whoami", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      mode: replicated
      replicas: 2
      placement:
        max_replicas_per_node: 1
      resources:
        limits:
          cpus: "0.10"
          memory: 32M
        reservations:
          cpus: "0.01"
          memory: 8M
      restart_policy: *default-restart
      update_config: *default-update
      labels:
        traefik.enable: "true"
        traefik.swarm.network: "edge"
        traefik.http.routers.whoami.rule: "Host(`whoami.${DOMAIN}`)"
        traefik.http.routers.whoami.entrypoints: "websecure"
        traefik.http.routers.whoami.tls: "true"
        traefik.http.routers.whoami.tls.options: "modern@file"
        traefik.http.routers.whoami.middlewares: "admin-chain-noauth@file"
        traefik.http.routers.whoami.service: "whoami"
        traefik.http.services.whoami.loadbalancer.server.port: "8080"
    logging: *default-logging

# =============================================================================
# Configs — versioned by content hash (CDC §10.2).
#
# Swarm configs are immutable: a changed file must become a NEW object with a
# new name, and the services must be updated to point at it. scripts/deploy.sh
# computes ${CONFIG_HASH_*} from the file content, so editing a config and
# redeploying is enough — no manual `docker config rm`.
# =============================================================================
configs:
  traefik_static:
    name: "traefik_static-${CONFIG_HASH_TRAEFIK_STATIC}"
    file: ../config/traefik/traefik.yml
  traefik_dynamic:
    name: "traefik_dynamic-${CONFIG_HASH_TRAEFIK_DYNAMIC}"
    # Rendered by scripts/deploy.sh: ${DOMAIN}, ${ADMIN_CIDR} and
    # ${CLUSTER_CIDR} are substituted before the object is created.
    file: ../.rendered/traefik-dynamic.yml
  crowdsec_acquis:
    name: "crowdsec_acquis-${CONFIG_HASH_CROWDSEC_ACQUIS}"
    file: ../config/crowdsec/acquis.yaml
  crowdsec_profiles:
    name: "crowdsec_profiles-${CONFIG_HASH_CROWDSEC_PROFILES}"
    file: ../config/crowdsec/profiles.yaml

secrets:
  dw_tls_cert:
    external: true
  dw_tls_key:
    external: true
  dw_traefik_htpasswd:
    external: true
  dw_crowdsec_bouncer_key:
    external: true
  dw_crowdsec_agent_password:
    external: true

volumes:
  # All local, all on node3 for the LAPI (pinned) or per-node for the agents.
  # `crowdsec_data` is the only one that is backed up (CDC §9.1): it holds the
  # decision history.
  crowdsec_data:
    driver: local
  crowdsec_config:
    driver: local
  crowdsec_agent_data:
    driver: local
  traefik_plugins:
    driver: local

networks:
  edge:
    external: true
  mgmt:
    external: true
  crowdsec:
    external: true
  monitoring:
    external: true
