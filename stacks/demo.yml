---
# =============================================================================
# Dockerwarts N°1 — big-data demo load (CDC §7.8, optionnel).
#
#   scripts/deploy.sh demo             (make deploy-demo)
#
# One service: demo-producer. It writes sensor events into Cassandra (at
# LOCAL_QUORUM) and into the `datalake-events` data stream, continuously.
#
# Why this is a stack of its own, and not a service in `data`
# ----------------------------------------------------------
# It is a load generator, not part of the platform. Keeping it separate means
# it can be deployed, stopped and redeployed without touching the datastores it
# writes to, and that a production-shaped deployment simply never runs
# `make deploy-demo`.
#
# It is nonetheless not optional for the HA campaign: CDC §8.2 n°5 asks for
# continuous load during the chaos tests, and its `demo_producer_errors_total`
# counter is what turns "the platform survived" into a measurement. Deploy it
# BEFORE `make chaos`, or the campaign reports the criterion as unmeasured.
#
# Documented in docs/04-composants/demo-producer.md.
# =============================================================================
version: "3.8"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  condition: on-failure
  delay: 10s
  max_attempts: 0

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  demo-producer:
    image: ${REGISTRY}/dockerwarts/demo-producer:${IMAGE_TAG}
    <<: *hardening
    # Nothing legitimately writes to the filesystem: the events go to Cassandra
    # and Elasticsearch, the metrics are served from memory.
    read_only: true
    tmpfs:
      - /tmp:size=16M
    user: "10003:10003"
    environment:
      # --- Load shape (CDC §7.8 defaults) ------------------------------------
      RATE: "${DEMO_RATE:-20}"
      SENSORS: "${DEMO_SENSORS:-50}"
      SITES: "poudlard,pre-au-lard,azkaban"
      # --- Cassandra ----------------------------------------------------------
      # The three members by name, not the service VIP: the driver is
      # token-aware and must see the individual nodes to send each write
      # straight to a replica of its partition. A VIP would hide the topology
      # and add a coordinator hop to every write.
      CASSANDRA_HOSTS: "cassandra-1,cassandra-2,cassandra-3"
      CASSANDRA_DC: dc1
      CASSANDRA_KEYSPACE: datalake
      CASSANDRA_USER: datalake_app
      CASSANDRA_PASSWORD_FILE: /run/secrets/dw_cassandra_app_password
      # --- Elasticsearch ------------------------------------------------------
      ES_URL: "http://es-1:9200"
      ES_USER: datalake_app
      ES_PASSWORD_FILE: /run/secrets/dw_es_app_password
      ES_DATA_STREAM: datalake-events
      METRICS_PORT: "8000"
      TZ: "${TZ}"
    secrets:
      - dw_cassandra_app_password
      - dw_es_app_password
    networks:
      - data          # Cassandra and Elasticsearch
      - monitoring    # Prometheus scrapes :8000
    healthcheck:
      # The metrics endpoint, and deliberately nothing deeper. A healthcheck
      # that probed Cassandra would restart the producer exactly when Cassandra
      # is unavailable — resetting the error counter this service exists to
      # keep, at the very moment it is being measured.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    # The producer handles SIGTERM and finishes the batch in flight: dying
    # mid-batch would leave rows in Cassandra with no matching document in
    # Elasticsearch, which during a chaos scenario would look like data loss.
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
      restart_policy: *default-restart
      update_config:
        parallelism: 1
        order: stop-first     # one writer, never two producing the same series
        failure_action: rollback
      labels:
        prometheus.job: "demo-producer"
        prometheus.port: "8000"
    logging: *default-logging

secrets:
  dw_cassandra_app_password:
    external: true
  dw_es_app_password:
    external: true

networks:
  data:
    external: true
  monitoring:
    external: true
