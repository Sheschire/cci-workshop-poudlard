---
# =============================================================================
# Role `firewall` — layer 1 of the four-layer firewall (CDC §6.1, ADR-0004).
#
# Design note
# -----------
# A plain `iptables-restore` of the whole `filter` table would wipe the chains
# Docker maintains (DOCKER, DOCKER-ISOLATION-STAGE-*, DOCKER-USER) and break
# container networking until the daemon is restarted. So this role owns exactly
# two chains and never touches the rest:
#
#   * DW-INPUT     — our own chain, jumped to from INPUT (policy DROP);
#   * DOCKER-USER  — created by Docker, evaluated *before* Docker's own FORWARD
#                    rules, which is the only place where published container
#                    ports can be filtered.
#
# Both are rebuilt from scratch by `/usr/local/sbin/dockerwarts-firewall`, which
# is therefore idempotent by construction. It is installed as a
# netfilter-persistent plugin (CDC §6.1) and re-applied at boot *after* Docker
# by `dockerwarts-firewall.service`, since DOCKER-USER does not exist before the
# daemon starts.
# =============================================================================

- name: Ensure netfilter-persistent is installed
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: present
  # Pre-seed the debconf answers so the package does not try to save the
  # current (empty) ruleset interactively.
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install the dockerwarts firewall script
  ansible.builtin.template:
    src: dockerwarts-firewall.sh.j2
    dest: /usr/local/sbin/dockerwarts-firewall
    mode: "0750"
    owner: root
    group: root
  notify: Apply the dockerwarts firewall

# netfilter-persistent calls every executable in plugins.d with start/stop/
# save/reload/flush. Symlinking our script keeps a single source of truth.
- name: Register the script as a netfilter-persistent plugin
  ansible.builtin.file:
    src: /usr/local/sbin/dockerwarts-firewall
    dest: /usr/share/netfilter-persistent/plugins.d/10-dockerwarts
    state: link
    force: true

- name: Install the boot-time firewall unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/dockerwarts-firewall.service
    mode: "0644"
    owner: root
    group: root
    content: |
      # Managed by Ansible — dockerwarts
      [Unit]
      Description=Dockerwarts host firewall (INPUT + DOCKER-USER)
      # DOCKER-USER only exists once the daemon has created it.
      After=docker.service network-online.target
      Wants=network-online.target
      Requires=docker.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/dockerwarts-firewall start
      ExecReload=/usr/local/sbin/dockerwarts-firewall start

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload systemd
    - Apply the dockerwarts firewall

- name: Enable the boot-time firewall unit
  ansible.builtin.systemd_service:
    name: dockerwarts-firewall.service
    enabled: true
    daemon_reload: true

# Handlers only run at the end of the play; the Swarm role that follows needs
# ports 2377/7946/4789 already open between the nodes.
- name: Apply the firewall now
  ansible.builtin.meta: flush_handlers

- name: Verify that DOCKER-USER carries the dockerwarts rules
  ansible.builtin.command: iptables -S DOCKER-USER
  register: firewall_docker_user_rules
  changed_when: false

- name: Fail if DOCKER-USER was not populated
  ansible.builtin.assert:
    that:
      - "'DW-DOCKER-USER-END' in firewall_docker_user_rules.stdout"
    fail_msg: >-
      DOCKER-USER does not contain the dockerwarts marker rule. Check
      `journalctl -u dockerwarts-firewall` on {{ inventory_hostname }}.
    success_msg: "DOCKER-USER is populated as expected."
