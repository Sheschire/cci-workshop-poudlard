---
# =============================================================================
# Role `swarm` — initialise the three-manager Swarm and create the overlay
# networks (ADR-0001, CDC §5.4).
#
# All three nodes are managers: Raft quorum 2/3, so the cluster survives the
# loss of one node. Losing two requires `docker swarm init --force-new-cluster`
# (procedure in docs/07-PRA.md).
#
# The overlay networks are created here, once, and referenced by every stack as
# `external: true`. Removing a stack therefore never destroys a network that
# another stack is still attached to.
# =============================================================================

# --- 1. Bootstrap the cluster on a single node -------------------------------
- name: Initialise the Swarm on the bootstrap node
  community.docker.docker_swarm:
    state: present
    advertise_addr: "{{ cluster_ip }}"
    listen_addr: "{{ cluster_ip }}:2377"
    default_addr_pool:
      - "{{ dw_swarm_default_addr_pool }}"
    subnet_size: "{{ dw_swarm_default_addr_pool_subnet_size }}"
    # Rotate the auto-lock off: an unattended reboot must bring the manager
    # back without an operator typing the unlock key (the disk is the trust
    # boundary here — see docs/03-reseau-securite.md).
    autolock_managers: false
    # Raft snapshots keep the control-plane log bounded on small disks.
    task_history_retention_limit: 5
  when: inventory_hostname in groups['swarm_bootstrap']
  register: swarm_init_result

- name: Read the Swarm join tokens from the bootstrap node
  community.docker.docker_swarm_info:
  when: inventory_hostname in groups['swarm_bootstrap']
  register: swarm_facts_result

- name: Publish the manager join token to every host
  ansible.builtin.set_fact:
    swarm_manager_token: >-
      {{ hostvars[groups['swarm_bootstrap'][0]].swarm_facts_result.swarm_facts.JoinTokens.Manager }}
    swarm_manager_addr: >-
      {{ hostvars[groups['swarm_bootstrap'][0]].cluster_ip }}:2377

# --- 2. Join the remaining managers ------------------------------------------
- name: Join the other nodes as managers
  community.docker.docker_swarm:
    state: join
    advertise_addr: "{{ cluster_ip }}"
    listen_addr: "{{ cluster_ip }}:2377"
    join_token: "{{ swarm_manager_token }}"
    remote_addrs:
      - "{{ swarm_manager_addr }}"
  when: inventory_hostname not in groups['swarm_bootstrap']

# --- 3. Verify the control plane ---------------------------------------------
- name: Collect the node list
  community.docker.docker_swarm_info:
    nodes: true
  run_once: true
  delegate_to: "{{ groups['swarm_bootstrap'][0] }}"
  register: swarm_nodes_result

- name: Assert that every node is a Ready manager
  ansible.builtin.assert:
    that:
      - swarm_nodes_result.nodes | length == groups['swarm_managers'] | length
    fail_msg: >-
      Expected {{ groups['swarm_managers'] | length }} Swarm nodes,
      found {{ swarm_nodes_result.nodes | length }}. Run `docker node ls` on
      {{ groups['swarm_bootstrap'][0] }}.
    success_msg: "{{ swarm_nodes_result.nodes | length }} Swarm nodes registered."
  run_once: true

# --- 4. Overlay networks ------------------------------------------------------
# `attachable: true` lets a one-shot container join a network for diagnostics
# and is required by tests/smoke/network-isolation.sh.
# `internal: true` removes the default gateway: no egress to the outside world.
# `encrypted` turns on IPsec between the nodes for that network (data only,
# CDC §5.4 — it costs measurable throughput, hence the switch).
- name: Create the overlay networks
  community.docker.docker_network:
    name: "{{ item.name }}"
    driver: overlay
    scope: swarm
    attachable: true
    internal: "{{ item.internal }}"
    driver_options: "{{ {'encrypted': ''} if (item.encrypted | bool) else {} }}"
    state: present
  loop: "{{ dw_overlay_networks }}"
  loop_control:
    label: "{{ item.name }} (internal={{ item.internal }}, encrypted={{ item.encrypted }})"
  run_once: true
  delegate_to: "{{ groups['swarm_bootstrap'][0] }}"
