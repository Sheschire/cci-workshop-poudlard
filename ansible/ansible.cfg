[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
collections_path     = ~/.ansible/collections
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
callbacks_enabled    = profile_tasks
interpreter_python   = /usr/bin/python3
# Keep facts between plays of the same run: the Swarm role needs facts from
# every host (manager token, IPs) while running on one host at a time.
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = /tmp/dockerwarts-facts
fact_caching_timeout = 900
forks                = 5
display_skipped_hosts = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
