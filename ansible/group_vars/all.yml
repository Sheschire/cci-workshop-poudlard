---
# =============================================================================
# Dockerwarts N°1 — variables shared by every role.
# Values mirror .env.example; keep both in sync (checked by `make lint`).
# =============================================================================

# --- Topology ----------------------------------------------------------------
dw_domain: dockerwarts.lan
dw_vip: 192.168.56.10
dw_cluster_cidr: 192.168.56.0/24
dw_admin_cidr: 192.168.56.1/32

# Interface carrying the cluster IPs and the VIP. On the Vagrant/VirtualBox
# host-only network this is the second NIC.
dw_cluster_interface: enp0s8

# --- Profile -----------------------------------------------------------------
# full | lite — only affects JVM heaps in the stacks, kept here so that the
# host sysctl tuning can follow if needed.
dw_profile: full

# --- Docker ------------------------------------------------------------------
# Pinned Docker Engine version installed from the official Docker repository.
# Empty string = latest available (not recommended for reproducibility).
dw_docker_version: "5:29.3.1-1~ubuntu.24.04~noble"
dw_containerd_version: "1.7.29-1"

# Internal registry, declared insecure in daemon.json (plain HTTP over the
# filtered lab network — CDC §10.2).
dw_registry_host: "192.168.56.13:5000"

# --- Swarm -------------------------------------------------------------------
dw_swarm_default_addr_pool: "10.20.0.0/16"
dw_swarm_default_addr_pool_subnet_size: 24

# Encryption of the `data` overlay network (CDC §5.4 / ADR-0007).
dw_data_network_encrypted: true

# Overlay networks created once by the `swarm` role. Every stack attaches to
# them as `external: true`, so a stack can be removed without dropping them.
dw_overlay_networks:
  - name: edge
    internal: false
    encrypted: false
  - name: data
    internal: true
    encrypted: "{{ dw_data_network_encrypted }}"
  - name: monitoring
    internal: true
    encrypted: false
  - name: mgmt
    internal: true
    encrypted: false
  - name: crowdsec
    internal: true
    encrypted: false

# --- NFS ---------------------------------------------------------------------
dw_nfs_root: /srv/nfs
dw_nfs_exports:
  # GLPI shared state: attachments, config, plugins, marketplace (ADR-0006).
  - path: "{{ dw_nfs_root }}/glpi/files"
    owner: 1000
    group: 1000
  - path: "{{ dw_nfs_root }}/glpi/config"
    owner: 1000
    group: 1000
  - path: "{{ dw_nfs_root }}/glpi/plugins"
    owner: 1000
    group: 1000
  - path: "{{ dw_nfs_root }}/glpi/marketplace"
    owner: 1000
    group: 1000
  # Textfile metrics written by the backup jobs, read by `backup-metrics`.
  - path: "{{ dw_nfs_root }}/backup-metrics"
    owner: 65534
    group: 65534

# --- Keepalived --------------------------------------------------------------
dw_keepalived_router_id: 51
dw_keepalived_vip_cidr: 24
# Health check of the local Traefik: losing it costs 60 points of priority,
# which is enough to hand the VIP over to the next node (150→90 < 100).
dw_keepalived_check_weight: -60
# VRRP simple password. Override in the inventory or with Ansible Vault; it is
# NOT a Docker secret (it configures a host service — CDC annexe A).
dw_keepalived_password: "changeme-vrrp"

# --- Host hardening ----------------------------------------------------------
dw_timezone: Europe/Paris
dw_sysctls:
  # Elasticsearch mmap requirement.
  vm.max_map_count: 262144
  # Keepalived must be able to bind the VIP before it owns it.
  net.ipv4.ip_nonlocal_bind: 1
  # Fluent Bit tails many container logs.
  fs.inotify.max_user_instances: 512
  fs.inotify.max_user_watches: 524288
  # Swap is poison for JVM-backed datastores.
  vm.swappiness: 1
  # Cassandra / Elasticsearch open a lot of files and sockets.
  net.core.somaxconn: 4096
  net.ipv4.tcp_keepalive_time: 300

# --- Published host names ----------------------------------------------------
# Every name Traefik routes (CDC §5.5). Written to /etc/hosts on the nodes and
# printed by `make hosts` for the client workstation; also the list the
# blackbox exporter probes and the smoke test walks.
dw_published_hostnames:
  - vip
  - traefik
  - glpi
  - grafana
  - kibana
  - prometheus
  - alertmanager
  - minio
  - whoami
