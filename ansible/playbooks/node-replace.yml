---
# =============================================================================
# Dockerwarts N°1 — replace a permanently lost node (PRA, docs/07-PRA.md §5).
#
#   ansible-playbook playbooks/node-replace.yml --limit node2
#
# Assumes: the replacement machine already exists, answers on the same
# cluster_ip and is reachable over SSH (Vagrant: `vagrant destroy -f node2 &&
# vagrant up node2`; cloud: a fresh instance with the same private IP).
#
# What it does, in order:
#   1. remove the dead node from the Swarm, from a surviving manager;
#   2. provision the replacement exactly like site.yml;
#   3. re-apply the placement labels, which makes Swarm reschedule the pinned
#      services (galera-N, cassandra-N, es-N, and possibly minio/registry)
#      onto it with EMPTY local volumes;
#   4. print the per-engine resynchronisation steps, which are deliberately
#      NOT automated: Galera SST, Cassandra `replace_address` and Elasticsearch
#      shard reallocation each need an operator decision (see the runbook).
# =============================================================================

- name: Remove the lost node from the Swarm
  hosts: swarm_managers
  become: true
  gather_facts: false
  # Run from a *surviving* manager, never from the node being replaced.
  tasks:
    - name: Pick a surviving manager
      ansible.builtin.set_fact:
        dw_survivor: >-
          {{ (groups['swarm_managers'] | difference(ansible_play_hosts_all))[0] }}
      run_once: true
      delegate_to: localhost
      become: false

    - name: List the Swarm nodes
      community.docker.docker_swarm_info:
        nodes: true
      delegate_to: "{{ dw_survivor }}"
      run_once: true
      register: dw_nodes

    - name: Force-remove the dead node
      community.docker.docker_node:
        hostname: "{{ inventory_hostname }}"
        state: absent
        force: true
      delegate_to: "{{ dw_survivor }}"
      when: inventory_hostname in (dw_nodes.nodes | map(attribute='Hostname') | list)
      # The node may already be gone if the operator ran `docker node rm` by
      # hand; that is not an error.
      failed_when: false

- name: Provision the replacement node
  hosts: swarm_managers
  become: true
  gather_facts: true
  roles:
    - role: common
    - role: docker
    - role: firewall
    - role: nfs-server
      when: inventory_hostname in groups['nfs_server']
    - role: nfs-client
    - role: swarm
    - role: node-labels
    - role: keepalived

  post_tasks:
    - name: Print the per-engine resynchronisation runbook
      ansible.builtin.debug:
        msg:
          - "Node {{ inventory_hostname }} has rejoined the Swarm with EMPTY local volumes."
          - ""
          - "MariaDB Galera — nothing to do: galera-{{ swarm_labels.galera | default('N') }}"
          - "  performs an automatic SST from a donor. Watch:"
          - "  docker service logs -f data_galera-{{ swarm_labels.galera | default('N') }}"
          - "  Confirm with: wsrep_cluster_size = 3"
          - ""
          - "Cassandra — the node must REPLACE the dead one, not bootstrap as a"
          - "  fourth member. Add to the service before it starts:"
          - "  JVM_OPTS=-Dcassandra.replace_address_first_boot=<old broadcast address>"
          - "  then `nodetool status` must show 3 UN, followed by"
          - "  `nodetool repair -pr` on the replacement."
          - ""
          - "Elasticsearch — nothing to do: the cluster reallocates the missing"
          - "  replicas by itself. Watch `_cluster/health` go yellow then green."
          - ""
          - "Then: make deploy && make smoke"
      run_once: true
