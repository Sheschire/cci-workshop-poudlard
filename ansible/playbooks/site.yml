---
# =============================================================================
# Dockerwarts N°1 — full host provisioning.
#
#   make provision          (or: ansible-playbook playbooks/site.yml)
#
# The playbook is idempotent: a second run must report 0 changed
# (acceptance criterion 0.2 of CDC §13).
#
# Order matters:
#   1. common     packages, sysctl, limits, SSH, fail2ban, logrotate, hosts
#   2. docker     engine + daemon.json  (must precede the firewall: DOCKER-USER
#                 only exists once the daemon has created it)
#   3. firewall   INPUT DROP + DOCKER-USER (must precede swarm: 2377/7946/4789)
#   4. nfs        server on node1, client everywhere
#   5. swarm      init, join, overlay networks
#   6. labels     placement labels for the stateful services
#   7. keepalived VIP (last: its health check probes Traefik, deployed later —
#                 until then every node fails the check equally and node1, the
#                 highest priority, keeps the VIP)
# =============================================================================

- name: Provision the Dockerwarts hosts
  hosts: swarm_managers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Fail early if the inventory is incomplete
      ansible.builtin.assert:
        that:
          - cluster_ip is defined
          - keepalived_priority is defined
          - groups['swarm_bootstrap'] | length == 1
          - groups['nfs_server'] | length == 1
        fail_msg: >-
          The inventory must define cluster_ip and keepalived_priority for every
          host, and exactly one host in each of swarm_bootstrap and nfs_server.
        quiet: true

  roles:
    - role: common
      tags: [common, base]

    - role: docker
      tags: [docker, base]

    - role: firewall
      tags: [firewall, security]

    - role: nfs-server
      tags: [nfs, storage]
      when: inventory_hostname in groups['nfs_server']

    - role: nfs-client
      tags: [nfs, storage]

    - role: swarm
      tags: [swarm]

    - role: node-labels
      tags: [swarm, labels]

    - role: keepalived
      tags: [keepalived, ha]

  post_tasks:
    - name: Summarise the cluster
      ansible.builtin.debug:
        msg:
          - "Swarm managers : {{ groups['swarm_managers'] | join(', ') }}"
          - "VIP            : {{ dw_vip }} (holder: highest healthy priority)"
          - "NFS server     : {{ groups['nfs_server'][0] }}"
          - "Registry       : {{ dw_registry_host }}"
          - "Overlay nets   : {{ dw_overlay_networks | map(attribute='name') | join(', ') }}"
          - "Next step      : make secrets certs build deploy"
      run_once: true
