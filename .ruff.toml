# ruff — lint + format for the home-made Python services (CDC §10.2).
target-version = "py312"
line-length = 100

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "S",        # flake8-bandit (security)
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "S101",   # `assert` is how pytest expresses its checks
    # The user-visible strings are French: en dashes, non-breaking spaces and
    # typographic apostrophes are correct typography, not confusables to fix.
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
"**/tests/*" = ["S105", "S106"]  # hard-coded test tokens are intentional
# gen-dashboards.py is a dashboard SPEC in Python clothing: its long lines are
# PromQL expressions, and wrapping them would make them harder to read and to
# diff, not easier.
"scripts/lib/gen-dashboards.py" = ["E501"]

[format]
quote-style = "double"
