---
# yamllint configuration — dockerwarts.
# The `relaxed` base plus explicit rules: readable YAML matters more than
# column-perfect YAML in configuration files that operators edit.
extends: relaxed

ignore: |
  .git/
  .vagrant/
  node_modules/
  # Grafana dashboards are machine-generated JSON-in-YAML-extension files.
  config/grafana/dashboards/
  # Build artefacts: .rendered/ is produced by scripts/lib/render.sh, and the
  # sources it renders are linted.
  .rendered/
  reports/
  secrets/
  certs/

rules:
  line-length:
    max: 160
    level: warning
    allow-non-breakable-words: true
  # `on:` in GitHub workflows is a legitimate key, not the boolean `true`.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  document-start:
    present: true
  empty-lines:
    max: 2
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
