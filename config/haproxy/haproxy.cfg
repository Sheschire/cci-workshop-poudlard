# =============================================================================
# HAProxy — `db-proxy`: single-writer front end for the Galera cluster.
#
# Mounted read-only at /usr/local/etc/haproxy/haproxy.cfg on the two db-proxy
# replicas. Rendered by scripts/lib/render.py (no ${VAR} is used today, but the
# file goes through the same pipeline as the others so that adding one later
# does not change the deployment path).
#
# Documented section by section in docs/04-composants/galera.md.
# Decision: ADR-0005 — MariaDB Galera + HAProxy single writer.
# =============================================================================

global
    log stdout format raw local0 info
    # Logs to stdout so they are collected like any container log by Fluent Bit
    # (CDC §7.4). A syslog socket would need a host bind mount for nothing.
    maxconn 2000
    # 300 max_connections per Galera node × 3, with headroom. HAProxy refuses
    # beyond this instead of letting a connection storm reach the database.
    stats timeout 30s
    # Modern defaults; HAProxy 2.9 in a container runs as its own user already.
    user haproxy
    group haproxy

defaults
    log     global
    mode    tcp
    # TCP and not HTTP: the MySQL protocol is binary and stateful. HAProxy
    # forwards bytes and only interprets enough of the handshake to health
    # check (see `option mysql-check`).
    option  dontlognull
    retries 3

    # --- Timeouts -------------------------------------------------------------
    # These three are the ones that matter for a database proxy:
    timeout connect 5s
    # Connecting to a Galera node is local (overlay network): 5 s is already
    # generous, and a shorter value makes a dead node detected faster.
    timeout client  600s
    timeout server  600s
    # 10 minutes, deliberately long. GLPI runs a few slow maintenance queries
    # (inventory, purge) and a `mariadb-dump` of the whole instance can take
    # minutes. A short timeout would cut the nightly backup in half, silently.
    timeout check   3s
    # The health check must be much shorter than the check interval, otherwise
    # a hung node is detected a whole interval late.

# =============================================================================
# MariaDB — the single-writer frontend
#
# THE key design point (ADR-0005). Galera is multi-master and would accept
# writes on all three nodes, but concurrent writes to the same rows from
# different nodes produce *certification failures*: the second commit is
# rolled back with a deadlock error. GLPI does not retry those, so a user would
# see a random save failure.
#
# Sending every write to ONE node removes the problem entirely, without giving
# up any availability: `backup` servers take over automatically, in a
# deterministic order, in under 5 seconds.
# =============================================================================
listen mariadb
    bind *:3306

    # --- Health check ---------------------------------------------------------
    # `option mysql-check` performs a real MySQL handshake — it does not merely
    # open a TCP socket. That distinction matters: a MariaDB that is up but
    # still applying an SST accepts the TCP connection and refuses the login.
    # A plain `check` would route traffic to it and fail every query.
    #
    # The `haproxy` account has no password and only USAGE (config/galera/init.sql):
    # the check must not depend on a secret, or rotating that secret would
    # silently break failover detection for the whole SQL tier.
    option mysql-check user haproxy

    # --- Backends -------------------------------------------------------------
    # galera-1 is the only active server. galera-2 and galera-3 carry `backup`:
    # HAProxy uses them only when every non-backup server is down, and takes
    # them in declaration order — so the writer after a failure is deterministic
    # and identical on both db-proxy replicas. Two replicas electing different
    # writers would reintroduce exactly the multi-master conflicts this design
    # exists to avoid.
    #
    #   inter 2s   check every 2 seconds
    #   rise 3     three successes before a node is used again — a node that
    #              just finished an SST needs a moment to be genuinely ready
    #   fall 2     two failures to evict it: fast, because a failed writer
    #              blocks the application
    #   on-marked-down shutdown-sessions
    #              kills the sessions still pinned to a node that just died,
    #              instead of letting them hang until `timeout server` (600 s).
    #              Without it, a node loss would freeze GLPI for ten minutes.
    server galera-1 galera-1:3306 check inter 2s rise 3 fall 2 on-marked-down shutdown-sessions
    server galera-2 galera-2:3306 check inter 2s rise 3 fall 2 backup on-marked-down shutdown-sessions
    server galera-3 galera-3:3306 check inter 2s rise 3 fall 2 backup on-marked-down shutdown-sessions

    # Do NOT use `option allbackups`: it would load-balance across galera-2 and
    # galera-3 once galera-1 is gone, which is multi-master again.

# =============================================================================
# Statistics and Prometheus metrics
#
# On the `monitoring` network only, no authentication: the network is
# `internal` (no gateway) and no port is published on any host. Adding a
# password here would only add a secret to rotate.
# =============================================================================
frontend stats
    bind *:8404
    mode http
    option httplog

    # Native Prometheus exporter (built into HAProxy since 2.0): no sidecar
    # exporter to deploy and keep in sync.
    http-request use-service prometheus-exporter if { path /metrics }

    stats enable
    stats uri /stats
    stats refresh 10s
    # CSV endpoint consumed by tests/smoke/smoke.sh to assert that exactly one
    # server is UP and not in backup state.
    stats show-legends
    stats show-node

    # Liveness for the container healthcheck.
    monitor-uri /healthz
