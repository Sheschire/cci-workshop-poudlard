---
# =============================================================================
# Elasticsearch 8.x — node configuration.
#
# Mounted read-only at /usr/share/elasticsearch/config/elasticsearch.yml on
# es-1, es-2 and es-3. What differs between the three nodes (`node.name`,
# `network.publish_host`, which certificate to use) comes from environment
# variables set per service in stacks/data.yml — Elasticsearch expands
# `${VAR}` inside this file natively, so no wrapper is needed here.
#
# Documented section by section in docs/04-composants/elasticsearch.md.
# Decision: ADR-0007 — Elasticsearch for logs and data; transport TLS, HTTP in
# clear text confined to the encrypted `data` overlay.
# =============================================================================

# --- Cluster identity ---------------------------------------------------------
cluster.name: dockerwarts
node.name: ${ES_NODE_NAME}

# All three nodes carry every role. On a 3-node cluster, dedicating a node to
# the master role would leave two data nodes and lose a third of the capacity
# for no availability gain: the quorum is 2 either way.
node.roles: [master, data, ingest, remote_cluster_client]

# --- Discovery ----------------------------------------------------------------
# Swarm service names. Swarm's internal DNS resolves each to the service's
# virtual IP, which survives rescheduling — a container IP would not.
discovery.seed_hosts:
  - es-1
  - es-2
  - es-3

# Bootstrap only: this setting elects the very first master of a brand-new
# cluster. Elasticsearch IGNORES it once the cluster has formed, and leaving it
# in place is harmless — but it must list exactly the three node names, or a
# node restarted alone could form a second, split-brain cluster.
cluster.initial_master_nodes:
  - es-1
  - es-2
  - es-3

# --- Network ------------------------------------------------------------------
# Bind to every interface inside the container, but PUBLISH the service name:
# the address the peers use to reach this node must be routable for them, and
# the container's own IP changes on every rescheduling.
network.host: 0.0.0.0
network.publish_host: ${ES_NODE_NAME}
http.port: 9200
transport.port: 9300

# --- Security (CDC §7.4, ADR-0007) -------------------------------------------
xpack.security.enabled: true

# TRANSPORT: TLS is mandatory. This is the channel that carries replication and
# the cluster state, and it is also the authentication boundary — a node
# without a certificate signed by the cluster CA simply cannot join.
xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.verification_mode: certificate
# `certificate` and not `full`: `full` also checks that the hostname matches
# the certificate. The SANs do contain the service names, but a Swarm service
# is reached through a virtual IP whose reverse lookup is not the service name,
# which makes `full` fail intermittently. `certificate` still requires a
# valid, CA-signed certificate on both ends — the property that matters.
xpack.security.transport.ssl.client_authentication: required
xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/certs/node.key
xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/certs/node.crt
xpack.security.transport.ssl.certificate_authorities:
  - /usr/share/elasticsearch/config/certs/ca.crt

# HTTP: deliberately NOT TLS (ADR-0007). The reasoning, in full:
#   * the `data` overlay is `internal` (no gateway, no route in or out) and
#     IPsec-encrypted between the nodes, so the confidentiality property TLS
#     would add is already provided one layer down;
#   * no port is published on any host, so the API is unreachable from outside
#     the overlay;
#   * authentication is still enforced (xpack.security.enabled), so this is
#     "authenticated over an encrypted network", not "open";
#   * the alternative would mean distributing and rotating client certificates
#     to Fluent Bit, Kibana, Grafana, the exporter and every backup job — five
#     more failure modes for a property already held.
# Switching it on is documented in docs/04-composants/elasticsearch.md.
xpack.security.http.ssl.enabled: false

# --- Memory -------------------------------------------------------------------
# Lock the heap into RAM. Swapping a JVM heap causes multi-second GC pauses
# that look exactly like a node failure to the rest of the cluster.
# Requires `ulimits.memlock: -1` on the service and the host `limits.d` entry
# set by the Ansible `common` role — both are in place.
bootstrap.memory_lock: true

# --- Storage ------------------------------------------------------------------
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs
# Repository path for the S3 snapshot plugin is not needed: `repository-s3` is
# built in since 8.x and is configured through the API by scripts/es-init.sh.

# --- Disk watermarks ----------------------------------------------------------
# Defaults are 85/90/95 % of the WHOLE filesystem. On a 40 GB node shared with
# Cassandra and MariaDB, hitting 90 % puts every index into read-only and is
# painful to undo. Lowering them buys reaction time: the `ESDiskWatermark`
# alert fires at 85 %, well before Elasticsearch starts refusing writes.
cluster.routing.allocation.disk.threshold_enabled: true
cluster.routing.allocation.disk.watermark.low: 80%
cluster.routing.allocation.disk.watermark.high: 85%
cluster.routing.allocation.disk.watermark.flood_stage: 90%

# --- Node loss behaviour ------------------------------------------------------
# How many shards may recover onto a node at once. Two: enough to rebuild after
# a node loss in reasonable time, few enough not to saturate the overlay.
#
# The related delay — how long the cluster WAITS before deciding a missing node
# is gone for good — is an INDEX setting, not a node one:
# `index.unassigned.node_left.delayed_timeout`, set to 5m in
# config/elasticsearch/templates/logs-common.json. The default of 1 minute is
# shorter than a Swarm reschedule, so a node restart would trigger a full shard
# rebuild only for the node to come back moments later.
cluster.routing.allocation.node_concurrent_recoveries: 2
indices.recovery.max_bytes_per_sec: 80mb
# Capped so that a recovery cannot saturate the overlay and starve Galera and
# Cassandra of bandwidth on the same 3 VMs.

# --- Miscellaneous ------------------------------------------------------------
# No phone-home, no automatic index creation from a typo in a client.
xpack.monitoring.collection.enabled: false
action.destructive_requires_name: true
# Refuses `DELETE /*` and `DELETE /_all`. The single cheapest protection
# against an accidental total data loss.
action.auto_create_index: ".monitoring*,.watches*,.triggered_watches*,.watcher-history*,.ml*"
# Data streams are created from templates by scripts/es-init.sh; a client must
# not be able to create an unmapped index by writing to a mistyped name.
