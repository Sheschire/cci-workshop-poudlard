---
# =============================================================================
# Kibana 8.x — configuration.
#
# Rendered by scripts/lib/render.py (${DOMAIN}) and mounted read-only at
# /usr/share/kibana/config/kibana.yml.
#
# Kibana's role here is *exploration*: ad-hoc log search, Discover, field
# analysis. The operational dashboards live in Grafana, which reads the same
# Elasticsearch indices through its own datasource (ADR-0007). Keeping both is
# deliberate — Grafana is better at correlating logs with metrics, Kibana is
# better at exploring an unfamiliar log corpus.
#
# Documented in docs/04-composants/kibana.md.
# =============================================================================

server.name: dockerwarts-kibana
server.host: "0.0.0.0"
server.port: 5601

# The public URL. Kibana builds absolute links (short URLs, saved-object
# permalinks, reporting) from this; getting it wrong yields links that work for
# the person who created them and 404 for everyone else.
server.publicBaseUrl: "https://kibana.${DOMAIN}"

# Traefik terminates TLS and rewrites nothing: Kibana is served at the root of
# its own hostname, so no basePath is needed.
server.rewriteBasePath: false

# --- Elasticsearch ------------------------------------------------------------
# All three nodes: Kibana round-robins and fails over on its own, so losing one
# ES node is invisible. Plain HTTP, over the `data` overlay only (ADR-0007).
elasticsearch.hosts:
  - "http://es-1:9200"
  - "http://es-2:9200"
  - "http://es-3:9200"

# The dedicated built-in service account. NEVER the `elastic` superuser: a
# Kibana compromise must not be a cluster compromise.
elasticsearch.username: "kibana_system"
# The password is NOT here. Kibana does not read Docker secrets, so
# config/common/secrets-entrypoint.sh turns
# ELASTICSEARCH_PASSWORD_FILE=/run/secrets/dw_es_kibana_password into
# ELASTICSEARCH_PASSWORD, which the official image maps onto this setting.
# Keeping it out of the file means the Swarm config object — readable with
# `docker config inspect` on any manager — carries no credential.

# A request that has not answered in 90 s is not going to. The default (30 s)
# is too aggressive for a Discover query over 90 days of logs on 3 small VMs.
elasticsearch.requestTimeout: 90000
elasticsearch.shardTimeout: 60000

# --- Encryption keys ----------------------------------------------------------
# These three keys encrypt saved objects, session cookies and reporting jobs
# AT REST in the .kibana index. They are supplied from Docker secrets through
# the environment (see stacks/data.yml).
#
# Why they matter: if they change, every encrypted saved object becomes
# unreadable — alerting rules and connectors are silently lost. They are
# therefore generated once by scripts/init-secrets.sh and belong in the vault
# alongside dw_restic_password.
#
# Supplied the same way, as
# XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY / XPACK_SECURITY_ENCRYPTIONKEY /
# XPACK_REPORTING_ENCRYPTIONKEY — all three pointing at the single
# dw_kibana_encryption_key secret, so the vault holds one value, not three.

# --- Sessions -----------------------------------------------------------------
# Kibana runs as a single replica (CDC §5.1), so sessions are in-memory and a
# reschedule logs users out. That is accepted: it is an exploration tool, not a
# user-facing service, and its RTO of 30–60 s is well inside CDC §9.4.
xpack.security.session.idleTimeout: "8h"
xpack.security.session.lifespan: "30d"

# --- Trimming the interface ---------------------------------------------------
# Everything below is switched off because it is unused here and each one
# costs memory in a JVM-adjacent Node process on a 6 GB node, plus background
# tasks that poll Elasticsearch.
telemetry.enabled: false
telemetry.optIn: false
xpack.reporting.enabled: false        # no PDF/CSV export needed
xpack.fleet.enabled: false            # no agent fleet: Fluent Bit does the job
xpack.apm.enabled: false
newsfeed.enabled: false               # would call out to the Internet

# Alerting stays ON: Kibana's own alerting is not used (Alertmanager is the
# single source of alerts, ADR-0009), but disabling the framework breaks
# several Discover features that depend on its task manager.
xpack.alerting.enabled: true
xpack.actions.enabled: true

# --- Logging ------------------------------------------------------------------
# JSON to stdout, collected like any container log by Fluent Bit.
logging:
  appenders:
    json-stdout:
      type: console
      layout:
        type: json
  root:
    appenders: [json-stdout]
    level: warn
  loggers:
    # Kibana logs every HTTP request at `info`, including the health probe
    # every 10 s. At `warn` the log stays useful instead of being noise.
    - name: http.server.response
      level: warn
    - name: elasticsearch.query
      level: warn

# --- Miscellaneous ------------------------------------------------------------
i18n.locale: "fr-FR"
# Interface in French, consistent with the documentation (CDC §N7). Field names
# and index names stay in English — they are data, not interface.

# Kibana refuses to start without this in 8.x when running behind a proxy that
# terminates TLS.
server.securityResponseHeaders.strictTransportSecurity: "max-age=31536000; includeSubDomains"
