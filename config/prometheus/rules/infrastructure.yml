---
# =============================================================================
# Alerting rules — hosts, Swarm, entry point (CDC annexe B).
#
# Mounted read-only at /etc/prometheus/rules/. Validated by
# `promtool check rules` and UNIT-TESTED by `promtool test rules`
# (config/prometheus/tests/) — a PromQL expression that looks right and never
# fires is the classic silent failure of an alerting stack.
#
# Annotation conventions, used by alert2glpi to build the ticket (ADR-0009):
#   summary      the ticket title
#   description  the ticket body — must contain the values that triggered it
#   runbook      link into docs/08-exploitation.md
#   dashboard    link into the relevant Grafana dashboard
# =============================================================================

groups:
  # ===========================================================================
  - name: nodes
    interval: 15s
    rules:
      # -----------------------------------------------------------------------
      # THE root alert. Everything else on a dead node is a consequence, and
      # Alertmanager's inhibition rules silence those (config/alertmanager).
      # Without that, losing one node would open a dozen GLPI tickets for a
      # single incident.
      # -----------------------------------------------------------------------
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
          component: node
        annotations:
          summary: "Nœud {{ $labels.node }} injoignable"
          description: >-
            Le nœud {{ $labels.node }} ne répond plus depuis 1 minute.
            Les services qui y étaient placés sont replanifiés par Swarm ;
            les membres stateful (galera, cassandra, es) épinglés sur ce nœud
            restent indisponibles jusqu'à son retour.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/08-exploitation.md#remplacer-un-nœud"
          dashboard: "https://grafana.${DOMAIN}/d/dw-overview"

      - alert: NodeDiskFillingUp
        # Free space below 20 %, on real filesystems only. `fstype` filtering
        # matters: without it, tmpfs and overlay mounts produce constant false
        # positives.
        expr: |
          (
            node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|ramfs"}
            / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|ramfs"}
          ) * 100 < 20
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "Espace disque faible sur {{ $labels.node }} ({{ $labels.mountpoint }})"
          description: >-
            Il reste {{ $value | printf "%.1f" }} % d'espace libre sur
            {{ $labels.mountpoint }} de {{ $labels.node }}.
            Elasticsearch passe ses index en lecture seule à 90 % d'occupation.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/08-exploitation.md#capacité-et-alertes-de-disque"

      - alert: NodeDiskFull
        expr: |
          (
            node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|ramfs"}
            / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|ramfs"}
          ) * 100 < 10
        for: 5m
        labels:
          severity: critical
          component: node
        annotations:
          summary: "Disque presque plein sur {{ $labels.node }} ({{ $labels.mountpoint }})"
          description: >-
            Il ne reste que {{ $value | printf "%.1f" }} % sur
            {{ $labels.mountpoint }}. Elasticsearch a probablement déjà basculé
            ses index en lecture seule, et Cassandra ne peut plus compacter.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/08-exploitation.md#capacité-et-alertes-de-disque"

      - alert: NodeMemoryPressure
        expr: |
          (
            node_memory_MemAvailable_bytes{job="node"}
            / node_memory_MemTotal_bytes{job="node"}
          ) * 100 < 10
        for: 5m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "Mémoire disponible faible sur {{ $labels.node }}"
          description: >-
            {{ $value | printf "%.1f" }} % de mémoire disponible.
            Le swap est désactivé sur ces nœuds : l'OOM killer tuera un
            conteneur plutôt que de swapper, et il choisira souvent une JVM.
          # MemAvailable and not MemFree: MemFree ignores reclaimable page
          # cache and would alert permanently on a healthy machine.

      - alert: NodeHighLoad
        # load5 above 2x the vCPU count. Normalised by CPU count so the rule
        # holds if a node is resized.
        expr: |
          node_load5{job="node"}
          > 2 * count by (node, instance, job) (node_cpu_seconds_total{job="node",mode="idle"})
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "Charge élevée sur {{ $labels.node }}"
          description: >-
            load5 = {{ $value | printf "%.2f" }}, soit plus de 2 fois le nombre
            de vCPU. Vérifier les compactions Cassandra et les merges
            Elasticsearch, qui sont les consommateurs habituels.

      - alert: NodeClockSkew
        # Galera and Cassandra both misbehave under clock drift; chrony is
        # installed for that reason, and this rule proves it is working.
        expr: abs(node_timex_offset_seconds{job="node"}) > 0.5
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "Dérive d'horloge sur {{ $labels.node }}"
          description: >-
            Décalage de {{ $value | printf "%.3f" }} s. Galera et Cassandra
            sont sensibles à la dérive d'horloge ; vérifier chrony.

  # ===========================================================================
  - name: swarm
    interval: 30s
    rules:
      - alert: SwarmServiceReplicasMismatch
        # A container seen by cAdvisor in the last minute, counted per service,
        # compared against nothing — Swarm does not export a "desired" metric
        # through cAdvisor. So this is expressed the other way round: a service
        # that had containers and now has none.
        expr: |
          (
            count by (container_label_com_docker_swarm_service_name) (
              container_last_seen{container_label_com_docker_swarm_service_name!=""}
            ) == 0
          )
        for: 2m
        labels:
          severity: warning
          component: swarm
        annotations:
          summary: "Service {{ $labels.container_label_com_docker_swarm_service_name }} sans tâche"
          description: >-
            Aucune tâche en cours d'exécution pour ce service depuis 2 minutes.
            Vérifier `docker service ps` : image introuvable, contrainte de
            placement insatisfaite, ou ressources insuffisantes.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/08-exploitation.md"

      - alert: ContainerRestarting
        # More than 3 starts in 10 minutes = a crash loop. `start_time_seconds`
        # changes value on each start, so counting its changes counts restarts.
        expr: |
          changes(container_start_time_seconds{container_label_com_docker_swarm_service_name!=""}[10m]) > 3
        for: 5m
        labels:
          severity: warning
          component: swarm
        annotations:
          summary: "Conteneur en redémarrage: {{ $labels.container_label_com_docker_swarm_service_name }}"
          description: >-
            {{ $value }} redémarrages en 10 minutes sur {{ $labels.node }}.
            C'est une boucle de crash : consulter
            `docker service logs {{ $labels.container_label_com_docker_swarm_service_name }}`.

      - alert: ContainerMemoryNearLimit
        # A container above 90 % of its cgroup limit is about to be OOM-killed.
        # Catching it here gives a chance to act before Swarm restarts it.
        expr: |
          (
            container_memory_working_set_bytes{container_label_com_docker_swarm_service_name!=""}
            / container_spec_memory_limit_bytes{container_label_com_docker_swarm_service_name!=""}
          ) * 100 > 90
          and container_spec_memory_limit_bytes{container_label_com_docker_swarm_service_name!=""} > 0
        for: 10m
        labels:
          severity: warning
          component: swarm
        annotations:
          summary: "{{ $labels.container_label_com_docker_swarm_service_name }} proche de sa limite mémoire"
          description: >-
            {{ $value | printf "%.1f" }} % de la limite. Le conteneur sera tué
            par l'OOM killer s'il continue.

  # ===========================================================================
  - name: edge
    interval: 15s
    rules:
      - alert: VipUnreachable
        # THE most important probe: if the VIP does not answer, nothing else
        # matters. 30 s and not 1 min, because the failover target is 5 s.
        expr: probe_success{job="blackbox-icmp"} == 0
        for: 30s
        labels:
          severity: critical
          component: edge
        annotations:
          summary: "VIP {{ $labels.instance }} injoignable"
          description: >-
            La VIP ne répond plus au ping depuis 30 secondes. AUCUN service
            n'est joignable. Vérifier keepalived sur les trois nœuds et le
            script chk_traefik.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/keepalived.md#8-exploitation"
          dashboard: "https://grafana.${DOMAIN}/d/dw-availability"

      - alert: TraefikDown
        expr: up{job="traefik"} == 0
        for: 1m
        labels:
          severity: critical
          component: edge
        annotations:
          summary: "Traefik absent sur {{ $labels.node }}"
          description: >-
            L'instance Traefik de {{ $labels.node }} ne répond plus.
            Ce nœud a perdu la VIP (chk_traefik échoue) ; les deux autres
            servent le trafic. Le service reste disponible, la redondance non.

      - alert: TraefikHigh5xx
        # Ratio and not absolute count: 10 errors per second is catastrophic on
        # a quiet platform and negligible under load.
        # `> 0` on the denominator avoids a division by zero producing NaN,
        # which would never fire.
        expr: |
          (
            sum by (node) (rate(traefik_entrypoint_requests_total{code=~"5..",entrypoint="websecure"}[5m]))
            /
            sum by (node) (rate(traefik_entrypoint_requests_total{entrypoint="websecure"}[5m])) > 0
          ) * 100 > 5
        for: 5m
        labels:
          severity: warning
          component: edge
        annotations:
          summary: "Plus de 5 % de 5xx sur Traefik ({{ $labels.node }})"
          description: >-
            {{ $value | printf "%.1f" }} % des requêtes HTTPS répondent en 5xx.
            Identifier le routeur fautif dans le dashboard Traefik.
          dashboard: "https://grafana.${DOMAIN}/d/dw-traefik"

      - alert: CertificateExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry{job=~"blackbox-http|blackbox-glpi"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
          component: edge
        annotations:
          summary: "Certificat TLS bientôt expiré ({{ $labels.instance }})"
          description: >-
            Le certificat expire dans {{ $value | printf "%.0f" }} jours.
            Régénérer avec `make certs` puis `docker service update --force edge_traefik`.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/08-exploitation.md#rotation-des-certificats"

      - alert: CrowdSecLapiDown
        expr: up{job="crowdsec"} == 0
        for: 2m
        labels:
          severity: warning
          component: security
        annotations:
          # Deliberately warning and not critical: the Traefik bouncer runs in
          # `stream` mode and keeps a local copy of the decision list, so
          # protection survives a LAPI outage. Making this critical would open
          # an on-call ticket for a situation needing no immediate action.
          summary: "CrowdSec LAPI injoignable"
          description: >-
            La LAPI ne répond plus depuis 2 minutes. La protection RESTE
            active : le bouncer Traefik fonctionne en mode `stream` avec un
            cache local des décisions. Seule la mise à jour des décisions est
            interrompue.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/crowdsec.md#11-exploitation"

  # ===========================================================================
  - name: availability
    interval: 15s
    rules:
      - alert: GLPIDown
        expr: probe_success{job="blackbox-glpi"} == 0
        for: 1m
        labels:
          severity: critical
          component: glpi
        annotations:
          summary: "GLPI indisponible"
          description: >-
            La sonde HTTP sur {{ $labels.instance }} échoue depuis 1 minute
            (code attendu 200 avec « GLPI » dans le corps).
            Vérifier les replicas glpi-web, puis db-proxy et Galera.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/glpi.md"
          dashboard: "https://grafana.${DOMAIN}/d/dw-overview"

      - alert: GLPISlow
        # p95 above 2 s, aligned on Galera's long_query_time so a slow page and
        # a slow query land in the same window and become correlatable.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~"glpi.*"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          component: glpi
        annotations:
          summary: "GLPI lent (p95 > 2 s)"
          description: >-
            p95 = {{ $value | printf "%.2f" }} s sur 5 minutes.
            Vérifier les requêtes lentes de Galera (`slow.log`) et la charge
            des nœuds.

      - alert: GrafanaDown
        expr: probe_success{job="blackbox-http",instance=~".*grafana.*"} == 0
        for: 1m
        labels:
          severity: critical
          component: grafana
        annotations:
          summary: "Grafana indisponible"
          description: >-
            Les deux replicas Grafana sont injoignables. L'état est en base
            Galera : vérifier db-proxy avant les replicas eux-mêmes.

      - alert: KibanaDown
        expr: probe_success{job="blackbox-http",instance=~".*kibana.*"} == 0
        for: 5m
        labels:
          severity: warning
          component: kibana
        annotations:
          # warning, and 5 minutes: Kibana is an exploration tool with a single
          # replica, so a reschedule legitimately makes it unavailable for a
          # minute. Alerting critical at 1 min would fire on every update.
          summary: "Kibana indisponible"
          description: >-
            Kibana ne répond plus depuis 5 minutes. Les logs continuent d'être
            collectés et indexés ; seule l'exploration est interrompue.

      - alert: MinIODown
        expr: probe_success{job="blackbox-http",instance=~".*minio.*"} == 0
        for: 5m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "MinIO indisponible"
          description: >-
            Le dépôt de sauvegarde ne répond plus. Les sauvegardes échoueront
            à leur prochaine exécution (BackupFailed suivra).
            Le service utilisateur n'est PAS affecté.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/minio.md"

  # ===========================================================================
  - name: monitoring-self
    interval: 30s
    rules:
      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Cible Prometheus absente: {{ $labels.job }} / {{ $labels.instance }}"
          description: >-
            La cible ne répond plus depuis 5 minutes. Si le service a été
            retiré volontairement, mettre à jour sa configuration ; sinon
            c'est une panne.

      - alert: AlertmanagerClusterDegraded
        # Fewer than 3 gossip members: deduplication still works with 2, but
        # the cluster no longer tolerates another loss.
        expr: alertmanager_cluster_members < 3
        for: 5m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Cluster Alertmanager dégradé ({{ $value }} membres)"
          description: >-
            Moins de 3 membres dans le cluster gossip. La déduplication
            fonctionne encore, mais une perte supplémentaire créerait des
            tickets GLPI en double.

      - alert: PrometheusReplicaMissing
        # The HA model relies on TWO identical instances. Losing one is not
        # user-visible, which is exactly why it needs an alert: nobody would
        # otherwise notice until the second one failed too.
        expr: count(up{job="prometheus"} == 1) < 2
        for: 10m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Une seule instance Prometheus active"
          description: >-
            Le modèle HA repose sur deux instances identiques. Il n'en reste
            qu'une : la supervision n'est plus redondante.

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Rechargement de configuration Prometheus en échec"
          description: >-
            Prometheus tourne sur son ANCIENNE configuration. Toute règle ou
            cible ajoutée récemment est ignorée.

      - alert: AlertmanagerNotificationsFailing
        # If notifications fail, alerts exist but nobody is told — the worst
        # possible failure mode of a monitoring stack.
        expr: rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Alertmanager n'arrive pas à notifier ({{ $labels.integration }})"
          description: >-
            Les notifications échouent : des alertes existent mais ne
            deviennent PAS des tickets GLPI. Vérifier le service alert2glpi.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/alert2glpi.md"
