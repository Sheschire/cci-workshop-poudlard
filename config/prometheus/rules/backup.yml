---
# =============================================================================
# Alerting rules — backups (CDC annexe B, §9.1).
#
# These two rules are the ones that turn "we have backups" into "we know our
# backups work". A backup job that silently stops is worse than no backup at
# all, because it produces false confidence.
#
# Source of the metrics: each job under scripts/backup/ writes a textfile-format
# .prom onto the shared NFS directory, served by the `backup-metrics` nginx.
#
#   backup_last_success_timestamp{job="…"}   unix seconds of the last success
#   backup_last_status{job="…"}              0 = success, non-zero = failure
#   backup_last_duration_seconds{job="…"}
#   backup_last_size_bytes{job="…"}
#
# Documented in docs/04-composants/backup.md and docs/07-PRA.md.
# =============================================================================

groups:
  - name: backup
    interval: 60s
    rules:
      # -----------------------------------------------------------------------
      # BackupTooOld — the job stopped running at all.
      #
      # 26 hours and not 24: the daily jobs run at fixed times, and a strict
      # 24 h window would fire every day in the minutes before the next run.
      # The two extra hours absorb a late start or a slow job without hiding a
      # genuinely missed night.
      #
      # `absent()` is deliberately NOT used here: a job that has never run has
      # no series at all, and alerting on that would fire on a brand-new
      # platform before the first scheduled run. That case is covered by
      # BackupNeverRan below, with a longer window.
      # -----------------------------------------------------------------------
      - alert: BackupTooOld
        expr: (time() - backup_last_success_timestamp) > 26 * 3600
        for: 10m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Sauvegarde {{ $labels.job }} trop ancienne"
          description: >-
            La dernière sauvegarde réussie de {{ $labels.job }} remonte à
            {{ $value | humanizeDuration }}. Le RPO de 24 h du CDC §9.4 n'est
            plus tenu. Vérifier swarm-cronjob et les logs du job.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/07-PRA.md"
          dashboard: "https://grafana.${DOMAIN}/d/dw-backup"

      # -----------------------------------------------------------------------
      # BackupFailed — the job ran and failed.
      #
      # Critical, unlike BackupTooOld: a failure is an immediate, actionable
      # event with an error message waiting in the logs, whereas "too old" can
      # be a scheduling hiccup.
      # -----------------------------------------------------------------------
      - alert: BackupFailed
        expr: backup_last_status != 0
        for: 5m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: "Échec de la sauvegarde {{ $labels.job }}"
          description: >-
            Le job {{ $labels.job }} s'est terminé en erreur (code
            {{ $value }}). Consulter
            `docker service logs backup_{{ $labels.job }}`.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/07-PRA.md"
          dashboard: "https://grafana.${DOMAIN}/d/dw-backup"

      # -----------------------------------------------------------------------
      # BackupNeverRan — no metric at all for a job that should exist.
      #
      # `absent()` on the whole metric family. 48 h so that a fresh deployment
      # has a full day plus margin to produce its first backup before anyone is
      # told. Without this rule, a job whose service was never created would be
      # invisible forever: BackupTooOld cannot fire on a series that does not
      # exist.
      # -----------------------------------------------------------------------
      - alert: BackupNeverRan
        expr: absent(backup_last_success_timestamp)
        for: 48h
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Aucune métrique de sauvegarde publiée"
          description: >-
            Aucune série `backup_last_success_timestamp` depuis 48 h. Soit la
            stack `backup` n'est pas déployée, soit `backup-metrics` ne sert
            pas le fichier, soit aucun job n'a jamais abouti.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/backup.md"

      # -----------------------------------------------------------------------
      # BackupDurationAnomaly — a job that suddenly takes much longer.
      #
      # Not in the CDC's minimum list, but it is the signal that catches a
      # repository growing out of control or a network problem BEFORE it turns
      # into a timeout and a real failure.
      # -----------------------------------------------------------------------
      - alert: BackupDurationAnomaly
        expr: |
          backup_last_duration_seconds
          > 3 * avg_over_time(backup_last_duration_seconds[7d])
          and backup_last_duration_seconds > 300
        for: 10m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Sauvegarde {{ $labels.job }} anormalement longue"
          description: >-
            {{ $value | humanizeDuration }}, soit plus de 3 fois la moyenne des
            7 derniers jours. Croissance du dépôt, contention disque ou
            problème réseau vers MinIO.

      # -----------------------------------------------------------------------
      # MinIOCapacity — the repository filling up.
      # -----------------------------------------------------------------------
      - alert: MinIOCapacityLow
        expr: |
          (
            minio_node_drive_free_bytes / minio_node_drive_total_bytes
          ) * 100 < 20
        for: 30m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Espace MinIO faible ({{ $value | printf \"%.1f\" }} % libre)"
          description: >-
            Le dépôt de sauvegarde se remplit. Vérifier que `restic-forget`
            s'exécute bien (06:00) et que la rétention SLM d'Elasticsearch
            purge les anciens snapshots.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/minio.md"
