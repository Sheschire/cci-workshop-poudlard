---
# =============================================================================
# Alerting rules — the three stateful clusters and the log pipeline
# (CDC annexe B).
#
# Documented in docs/05-monitoring.md (table: name, condition, severity,
# action).
# =============================================================================

groups:
  # ===========================================================================
  - name: galera
    interval: 15s
    rules:
      - alert: MariaDBDown
        expr: mysql_up{job="mysqld"} == 0
        for: 1m
        labels:
          severity: critical
          component: galera
        annotations:
          summary: "Membre Galera {{ $labels.instance }} injoignable"
          description: >-
            {{ $labels.instance }} ne répond plus. Si c'est galera-1, HAProxy
            a déjà basculé les écritures sur galera-2 : le service continue,
            la redondance est réduite.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/galera.md#9-reprise--scriptsgalera-recoversh"

      - alert: GaleraClusterSizeLt3
        expr: mysql_global_status_wsrep_cluster_size < 3
        for: 2m
        labels:
          severity: warning
          component: galera
        annotations:
          summary: "Cluster Galera à {{ $value }} membres"
          description: >-
            Le cluster fonctionne encore (quorum 2/3) mais ne tolère plus
            aucune perte supplémentaire. Identifier le membre absent et le
            faire rejoindre.

      - alert: GaleraQuorumLost
        # BELOW 2 = no quorum: Galera refuses writes. That is the correct
        # behaviour (accepting writes without quorum would split the data),
        # but it means GLPI is read-only.
        expr: mysql_global_status_wsrep_cluster_size < 2
        for: 1m
        labels:
          severity: critical
          component: galera
        annotations:
          summary: "Quorum Galera perdu ({{ $value }} membre)"
          description: >-
            Le cluster a perdu son quorum et REFUSE LES ÉCRITURES. GLPI et
            Grafana sont en lecture seule. C'est le comportement correct, mais
            il faut agir : voir la procédure de reprise.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/07-PRA.md"

      - alert: GaleraNotSynced
        # wsrep_local_state: 4 = Synced. Anything else (1 Joining, 2 Donor,
        # 3 Joined) means the node is not serving the current dataset.
        expr: mysql_global_status_wsrep_local_state != 4
        for: 5m
        labels:
          severity: critical
          component: galera
        annotations:
          summary: "{{ $labels.instance }} n'est pas synchronisé (état {{ $value }})"
          description: >-
            État wsrep_local_state = {{ $value }} (4 = Synced attendu).
            1 = Joining, 2 = Donor/Desynced, 3 = Joined. Un SST en cours est
            normal pendant quelques minutes ; au-delà, investiguer.

      - alert: GaleraFlowControlPaused
        # The share of time the cluster BRAKED writes because a node could not
        # keep up. The earliest signal of a struggling node — well before it
        # actually fails.
        expr: mysql_global_status_wsrep_flow_control_paused > 0.1
        for: 10m
        labels:
          severity: warning
          component: galera
        annotations:
          summary: "Galera freine les écritures ({{ $value | printf \"%.0f\" }} %)"
          description: >-
            Le contrôle de flux est actif plus de 10 % du temps : un membre
            n'arrive pas à suivre le rythme de réplication. Vérifier sa charge
            disque et CPU avant qu'il ne décroche.

      - alert: HAProxyNoWriter
        # No backend UP on the mariadb listener = the SQL tier is unreachable
        # even though the members might individually be alive.
        expr: |
          sum by (proxy) (haproxy_server_status{proxy="mariadb"}) == 0
        for: 1m
        labels:
          severity: critical
          component: galera
        annotations:
          summary: "Aucun backend Galera disponible dans HAProxy"
          description: >-
            HAProxy ne voit plus aucun membre Galera UP. Vérifier le compte
            `haproxy` (sans mot de passe, USAGE seulement) et l'état des
            membres.

  # ===========================================================================
  - name: cassandra
    interval: 30s
    rules:
      - alert: CassandraNodeDown
        expr: up{job="cassandra"} == 0
        for: 2m
        labels:
          severity: critical
          component: cassandra
        annotations:
          summary: "Nœud Cassandra {{ $labels.instance }} injoignable"
          description: >-
            Avec RF=3 et LOCAL_QUORUM, les lectures et écritures continuent sur
            les deux nœuds restants. Les écritures destinées au nœud absent
            sont accumulées en « hints » ; un `nodetool repair` sera nécessaire
            à son retour.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/cassandra.md"

      - alert: CassandraQuorumAtRisk
        expr: count(up{job="cassandra"} == 1) < 2
        for: 1m
        labels:
          severity: critical
          component: cassandra
        annotations:
          summary: "Quorum Cassandra en danger ({{ $value }} nœud disponible)"
          description: >-
            Moins de 2 nœuds : LOCAL_QUORUM ne peut plus être satisfait.
            Les écritures ET les lectures du datalake échouent.

      - alert: CassandraPendingCompactions
        expr: cassandra_compaction_PendingTasks > 100
        for: 15m
        labels:
          severity: warning
          component: cassandra
        annotations:
          summary: "{{ $value }} compactions en attente sur {{ $labels.instance }}"
          description: >-
            Le nœud n'arrive pas à compacter au rythme des écritures. Laissé
            en l'état, cela finit en amplification de lecture puis en
            saturation disque.

      - alert: CassandraHintsAccumulating
        # Hints are writes buffered for an absent peer. A rising count is the
        # earliest evidence that a peer is unreachable — often before the
        # failure detector notices.
        expr: cassandra_storage_TotalHints > 10000
        for: 15m
        labels:
          severity: warning
          component: cassandra
        annotations:
          summary: "Hints en accumulation sur {{ $labels.instance }}"
          description: >-
            {{ $value }} hints en attente : un pair est injoignable et les
            écritures qui lui sont destinées s'accumulent. Prévoir un
            `nodetool repair -pr` après son retour.

      - alert: CassandraConsistencyFailures
        # Unavailables != 0 means the requested consistency level could NOT be
        # met: an application-visible failure, not a warning sign.
        expr: rate(cassandra_client_request_Unavailables_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          component: cassandra
        annotations:
          summary: "Cassandra ne satisfait plus LOCAL_QUORUM ({{ $labels.operation }})"
          description: >-
            Des requêtes {{ $labels.operation }} échouent faute de réplicas
            disponibles. Le datalake perd des écritures côté application.

      - alert: CassandraDiskUsage
        expr: |
          (
            node_filesystem_avail_bytes{job="node",mountpoint="/"}
            / node_filesystem_size_bytes{job="node",mountpoint="/"}
          ) * 100 < 25
          and on(node) count by (node) (up{job="cassandra"} == 1) > 0
        for: 15m
        labels:
          severity: warning
          component: cassandra
        annotations:
          summary: "Espace disque limité sur un nœud Cassandra ({{ $labels.node }})"
          description: >-
            {{ $value | printf "%.1f" }} % libre. Cassandra a besoin d'espace
            libre équivalent à la plus grosse SSTable pour compacter : sous
            ~25 %, les compactions commencent à échouer.

  # ===========================================================================
  - name: elasticsearch
    interval: 30s
    rules:
      - alert: ESClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 1m
        labels:
          severity: critical
          component: elasticsearch
        annotations:
          summary: "Cluster Elasticsearch ROUGE"
          description: >-
            Au moins un shard PRIMAIRE est indisponible : des données ne sont
            pas lisibles et l'indexation échoue pour les index concernés.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/07-PRA.md"

      - alert: ESClusterYellow
        # 10 minutes, deliberately: `yellow` is the NORMAL, transient state
        # during a reschedule while replicas reallocate. Alerting immediately
        # would fire on every rolling update.
        expr: elasticsearch_cluster_health_status{color="yellow"} == 1
        for: 10m
        labels:
          severity: warning
          component: elasticsearch
        annotations:
          summary: "Cluster Elasticsearch jaune depuis 10 minutes"
          description: >-
            Des répliques ne sont pas allouées. C'est normal quelques minutes
            après une replanification ; au-delà, un nœud manque ou le disque
            est saturé.

      - alert: ESDiskWatermark
        expr: |
          (
            1 - (
              elasticsearch_filesystem_data_available_bytes
              / elasticsearch_filesystem_data_size_bytes
            )
          ) * 100 > 85
        for: 10m
        labels:
          severity: warning
          component: elasticsearch
        annotations:
          summary: "Elasticsearch au-dessus du watermark haut ({{ $labels.name }})"
          description: >-
            {{ $value | printf "%.1f" }} % d'occupation. Le flood stage est à
            90 % : au-delà, TOUS les index passent en lecture seule et il faut
            les débloquer manuellement.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/08-exploitation.md#purge--rollover-elasticsearch"

      - alert: ESJVMHeapHigh
        expr: |
          (
            elasticsearch_jvm_memory_used_bytes{area="heap"}
            / elasticsearch_jvm_memory_max_bytes{area="heap"}
          ) * 100 > 85
        for: 15m
        labels:
          severity: warning
          component: elasticsearch
        annotations:
          summary: "Heap JVM Elasticsearch élevé ({{ $labels.name }})"
          description: >-
            {{ $value | printf "%.1f" }} % du heap utilisé. Au-delà de 85 %
            durablement, le GC tourne en continu et les pauses ressemblent à
            une panne de nœud vue du cluster.

      - alert: ESSnapshotFailed
        # The backup that silently stops is the one that is missing on the day
        # it is needed. `slm_operation_mode` is not enough: a policy can be
        # enabled and still fail every night.
        expr: |
          elasticsearch_slm_stats_snapshots_failed_total
          - elasticsearch_slm_stats_snapshots_failed_total offset 1d > 0
        for: 5m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: "Snapshot Elasticsearch en échec"
          description: >-
            Au moins un snapshot SLM a échoué dans les dernières 24 h.
            Vérifier le repository MinIO (`_snapshot/minio/_verify`) et
            l'espace disponible.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/07-PRA.md"

  # ===========================================================================
  - name: logging
    interval: 30s
    rules:
      - alert: FluentBitOutputErrors
        expr: rate(fluentbit_output_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: logging
        annotations:
          summary: "Fluent Bit en erreur de sortie sur {{ $labels.node }}"
          description: >-
            La sortie Elasticsearch échoue. Les logs ne sont PAS perdus (buffer
            sur disque + réessai infini), mais ils s'accumulent : sous
            `storage.total_limit_size`, les plus anciens finiront par être
            jetés.
          runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/fluent-bit.md"

      - alert: FluentBitBacklogGrowing
        # The gap between what is read and what is delivered: the real measure
        # of collection lag.
        expr: |
          (
            sum by (node) (rate(fluentbit_input_records_total[10m]))
            - sum by (node) (rate(fluentbit_output_proc_records_total[10m]))
          ) > 100
        for: 15m
        labels:
          severity: warning
          component: logging
        annotations:
          summary: "Retard de collecte des logs sur {{ $labels.node }}"
          description: >-
            Fluent Bit lit plus vite qu'il ne livre depuis 15 minutes.
            Vérifier l'indexation Elasticsearch.
