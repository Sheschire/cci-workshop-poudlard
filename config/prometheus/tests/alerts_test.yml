---
# =============================================================================
# Unit tests for the alerting rules — `promtool test rules`.
#
# Run by `make lint` and by the CI `validate` job.
#
# Why these exist
# ---------------
# `promtool check rules` only proves a rule PARSES. The classic failure of an
# alerting stack is a rule that parses, looks correct, and never fires — a
# typo in a label matcher, a division that yields NaN, a `for:` longer than the
# incident. That is silent, and it is discovered during the incident.
#
# These tests feed synthetic series into the real rules and assert both
# directions: the alert FIRES when it should, and does NOT fire when it
# should not. The second half matters as much as the first: an alert that
# fires all the time gets muted by the operator and stops protecting anything.
# =============================================================================

rule_files:
  - ../rules/infrastructure.yml
  - ../rules/datastores.yml
  - ../rules/backup.yml

evaluation_interval: 15s

tests:
  # ===========================================================================
  # NodeDown — the root alert of the whole inhibition chain
  # ===========================================================================
  - interval: 15s
    name: NodeDown fires after 1 minute and not before
    input_series:
      - series: 'up{job="node", instance="node1", node="node1"}'
        # 0 for 3 minutes: up up up then down.
        values: "1+0x4 0+0x12"
      - series: 'up{job="node", instance="node2", node="node2"}'
        values: "1+0x20"
    alert_rule_test:
      # At 30 s the node has been down for ~15 s: `for: 1m` must hold it back.
      - eval_time: 1m15s
        alertname: NodeDown
        exp_alerts: []
      # At 2m30s it has been down well over a minute.
      - eval_time: 2m30s
        alertname: NodeDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: node
              job: node
              instance: node1
              node: node1
            exp_annotations:
              summary: "Nœud node1 injoignable"
              description: >-
                Le nœud node1 ne répond plus depuis 1 minute. Les services qui y étaient placés sont replanifiés par Swarm ; les membres stateful (galera, cassandra, es) épinglés sur ce nœud restent indisponibles jusqu'à son retour.
              runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/08-exploitation.md#remplacer-un-nœud"
              dashboard: "https://grafana.${DOMAIN}/d/dw-overview"

  # ===========================================================================
  # Galera — the quorum boundary is the thing that must be exact
  # ===========================================================================
  - interval: 15s
    name: Galera cluster size drives the right severity
    input_series:
      - series: 'mysql_global_status_wsrep_cluster_size{instance="galera-1"}'
        # 3 for a minute, then 2 (degraded), then 1 (quorum lost).
        values: "3+0x4 2+0x12 1+0x12"
    alert_rule_test:
      # Healthy: neither alert.
      - eval_time: 1m
        alertname: GaleraClusterSizeLt3
        exp_alerts: []
      # Size 2: warning only — the cluster still serves writes.
      - eval_time: 3m30s
        alertname: GaleraClusterSizeLt3
        exp_alerts:
          - exp_labels:
              severity: warning
              component: galera
              instance: galera-1
            exp_annotations:
              summary: "Cluster Galera à 2 membres"
              description: >-
                Le cluster fonctionne encore (quorum 2/3) mais ne tolère plus aucune perte supplémentaire. Identifier le membre absent et le faire rejoindre.
      - eval_time: 3m30s
        alertname: GaleraQuorumLost
        exp_alerts: []
      # Size 1: quorum lost — critical, writes refused.
      - eval_time: 6m
        alertname: GaleraQuorumLost
        exp_alerts:
          - exp_labels:
              severity: critical
              component: galera
              instance: galera-1
            exp_annotations:
              summary: "Quorum Galera perdu (1 membre)"
              description: >-
                Le cluster a perdu son quorum et REFUSE LES ÉCRITURES. GLPI et Grafana sont en lecture seule. C'est le comportement correct, mais il faut agir : voir la procédure de reprise.
              runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/07-PRA.md"

  - interval: 15s
    name: GaleraNotSynced fires on any state other than 4
    input_series:
      # 4 = Synced, then 2 = Donor/Desynced for 6 minutes.
      - series: 'mysql_global_status_wsrep_local_state{instance="galera-2"}'
        values: "4+0x8 2+0x28"
    alert_rule_test:
      - eval_time: 2m
        alertname: GaleraNotSynced
        exp_alerts: []
      - eval_time: 8m
        alertname: GaleraNotSynced
        exp_alerts:
          - exp_labels:
              severity: critical
              component: galera
              instance: galera-2
            exp_annotations:
              summary: "galera-2 n'est pas synchronisé (état 2)"
              description: >-
                État wsrep_local_state = 2 (4 = Synced attendu). 1 = Joining, 2 = Donor/Desynced, 3 = Joined. Un SST en cours est normal pendant quelques minutes ; au-delà, investiguer.

  # ===========================================================================
  # Elasticsearch — yellow must NOT fire before 10 minutes
  # ===========================================================================
  - interval: 15s
    name: ESClusterYellow tolerates a transient reschedule
    input_series:
      - series: 'elasticsearch_cluster_health_status{color="yellow", cluster="dockerwarts"}'
        # Yellow for 8 minutes then green again: a normal rolling update.
        values: "1+0x32 0+0x20"
      - series: 'elasticsearch_cluster_health_status{color="red", cluster="dockerwarts"}'
        values: "0+0x52"
    alert_rule_test:
      # 8 minutes of yellow must stay silent: this is the whole point of the
      # 10-minute threshold.
      - eval_time: 8m
        alertname: ESClusterYellow
        exp_alerts: []
      - eval_time: 8m
        alertname: ESClusterRed
        exp_alerts: []

  - interval: 15s
    name: ESClusterYellow fires when yellow persists
    input_series:
      - series: 'elasticsearch_cluster_health_status{color="yellow", cluster="dockerwarts"}'
        values: "1+0x60"
    alert_rule_test:
      - eval_time: 11m
        alertname: ESClusterYellow
        exp_alerts:
          - exp_labels:
              severity: warning
              component: elasticsearch
              color: yellow
              cluster: dockerwarts
            exp_annotations:
              summary: "Cluster Elasticsearch jaune depuis 10 minutes"
              description: >-
                Des répliques ne sont pas allouées. C'est normal quelques minutes après une replanification ; au-delà, un nœud manque ou le disque est saturé.

  - interval: 15s
    name: ESClusterRed fires quickly
    input_series:
      - series: 'elasticsearch_cluster_health_status{color="red", cluster="dockerwarts"}'
        values: "0+0x4 1+0x20"
    alert_rule_test:
      - eval_time: 2m30s
        alertname: ESClusterRed
        exp_alerts:
          - exp_labels:
              severity: critical
              component: elasticsearch
              color: red
              cluster: dockerwarts
            exp_annotations:
              summary: "Cluster Elasticsearch ROUGE"
              description: >-
                Au moins un shard PRIMAIRE est indisponible : des données ne sont pas lisibles et l'indexation échoue pour les index concernés.
              runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/07-PRA.md"

  # ===========================================================================
  # Backups — the acceptance criterion 5.4 of the CDC
  # ===========================================================================
  - interval: 1m
    name: BackupTooOld fires past 26 hours and not at 25
    input_series:
      # A constant timestamp: as test time advances, the backup ages.
      # Start of the test window is epoch 0, so a success at t=0 is
      # "now - 0" seconds old at each evaluation.
      - series: 'backup_last_success_timestamp{job="backup-galera"}'
        values: "0+0x1700"
    alert_rule_test:
      # 25 h: still inside the tolerance, must stay silent. This is the
      # regression that matters — a 24 h threshold would fire here every day.
      - eval_time: 25h
        alertname: BackupTooOld
        exp_alerts: []
      # 26 h 30 min: past the threshold plus the 10-minute `for`.
      - eval_time: 26h30m
        alertname: BackupTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              component: backup
              job: backup-galera
            exp_annotations:
              summary: "Sauvegarde backup-galera trop ancienne"
              description: >-
                La dernière sauvegarde réussie de backup-galera remonte à 1d 2h 30m 0s. Le RPO de 24 h du CDC §9.4 n'est plus tenu. Vérifier swarm-cronjob et les logs du job.
              runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/07-PRA.md"
              dashboard: "https://grafana.${DOMAIN}/d/dw-backup"

  - interval: 1m
    name: BackupFailed fires on a non-zero status
    input_series:
      - series: 'backup_last_status{job="backup-cassandra-1"}'
        values: "0+0x5 1+0x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: BackupFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              component: backup
              job: backup-cassandra-1
            exp_annotations:
              summary: "Échec de la sauvegarde backup-cassandra-1"
              description: >-
                Le job backup-cassandra-1 s'est terminé en erreur (code 1). Consulter `docker service logs backup_backup-cassandra-1`.
              runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/07-PRA.md"
              dashboard: "https://grafana.${DOMAIN}/d/dw-backup"

  # ===========================================================================
  # Entry point
  # ===========================================================================
  - interval: 15s
    name: VipUnreachable fires within 30 seconds
    input_series:
      - series: 'probe_success{job="blackbox-icmp", instance="192.168.56.10"}'
        values: "1+0x4 0+0x12"
    alert_rule_test:
      - eval_time: 1m45s
        alertname: VipUnreachable
        exp_alerts:
          - exp_labels:
              severity: critical
              component: edge
              job: blackbox-icmp
              instance: 192.168.56.10
            exp_annotations:
              summary: "VIP 192.168.56.10 injoignable"
              description: >-
                La VIP ne répond plus au ping depuis 30 secondes. AUCUN service n'est joignable. Vérifier keepalived sur les trois nœuds et le script chk_traefik.
              runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/keepalived.md#8-exploitation"
              dashboard: "https://grafana.${DOMAIN}/d/dw-availability"

  - interval: 15s
    name: GLPIDown fires when the probe fails
    input_series:
      - series: 'probe_success{job="blackbox-glpi", instance="https://glpi.dockerwarts.lan/"}'
        values: "1+0x4 0+0x16"
    alert_rule_test:
      - eval_time: 1m
        alertname: GLPIDown
        exp_alerts: []
      - eval_time: 3m
        alertname: GLPIDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: glpi
              job: blackbox-glpi
              instance: "https://glpi.dockerwarts.lan/"
            exp_annotations:
              summary: "GLPI indisponible"
              description: >-
                La sonde HTTP sur https://glpi.dockerwarts.lan/ échoue depuis 1 minute (code attendu 200 avec « GLPI » dans le corps). Vérifier les replicas glpi-web, puis db-proxy et Galera.
              runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/04-composants/glpi.md"
              dashboard: "https://grafana.${DOMAIN}/d/dw-overview"

  # ===========================================================================
  # TraefikHigh5xx — the rule most at risk of a division-by-zero NaN
  # ===========================================================================
  - interval: 15s
    name: TraefikHigh5xx does not fire on zero traffic
    input_series:
      # No traffic at all: the denominator is 0. A naive expression would
      # produce NaN and either never fire or fire permanently.
      - series: 'traefik_entrypoint_requests_total{code="200", entrypoint="websecure", node="node1"}'
        values: "0+0x40"
      - series: 'traefik_entrypoint_requests_total{code="500", entrypoint="websecure", node="node1"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: TraefikHigh5xx
        exp_alerts: []

  - interval: 15s
    name: TraefikHigh5xx fires above 5 percent
    input_series:
      # 100 successful req per 15 s interval, 20 errors: 16.7 % — well over 5.
      - series: 'traefik_entrypoint_requests_total{code="200", entrypoint="websecure", node="node1"}'
        values: "0+100x60"
      - series: 'traefik_entrypoint_requests_total{code="500", entrypoint="websecure", node="node1"}'
        values: "0+20x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: TraefikHigh5xx
        exp_alerts:
          - exp_labels:
              severity: warning
              component: edge
              node: node1
            exp_annotations:
              summary: "Plus de 5 % de 5xx sur Traefik (node1)"
              description: >-
                16.7 % des requêtes HTTPS répondent en 5xx. Identifier le routeur fautif dans le dashboard Traefik.
              dashboard: "https://grafana.${DOMAIN}/d/dw-traefik"

  # ===========================================================================
  # Certificates
  # ===========================================================================
  - interval: 1m
    name: CertificateExpiringSoon fires under 14 days
    input_series:
      # Expiry 10 days after epoch: at every evaluation, (expiry - now) is
      # under 14 days.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-http", instance="https://grafana.dockerwarts.lan/api/health"}'
        values: "864000+0x200"
    alert_rule_test:
      - eval_time: 2h
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              component: edge
              job: blackbox-http
              instance: "https://grafana.dockerwarts.lan/api/health"
            exp_annotations:
              summary: "Certificat TLS bientôt expiré (https://grafana.dockerwarts.lan/api/health)"
              description: >-
                Le certificat expire dans 10 jours. Régénérer avec `make certs` puis `docker service update --force edge_traefik`.
              runbook: "https://github.com/Sheschire/cci-workshop-poudlard/blob/main/docs/08-exploitation.md#rotation-des-certificats"

  # ===========================================================================
  # Cassandra — a consistency failure is application-visible
  # ===========================================================================
  - interval: 15s
    name: CassandraConsistencyFailures fires on any Unavailables
    input_series:
      - series: 'cassandra_client_request_Unavailables_total{instance="cassandra-1", operation="Write"}'
        values: "0+0x8 0+5x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: CassandraConsistencyFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              component: cassandra
              instance: cassandra-1
              operation: Write
            exp_annotations:
              summary: "Cassandra ne satisfait plus LOCAL_QUORUM (Write)"
              description: >-
                Des requêtes Write échouent faute de réplicas disponibles. Le datalake perd des écritures côté application.

  # ===========================================================================
  # Monitoring of the monitoring
  # ===========================================================================
  - interval: 15s
    name: PrometheusReplicaMissing fires when only one instance remains
    input_series:
      - series: 'up{job="prometheus", instance="prom-a"}'
        values: "1+0x60"
      - series: 'up{job="prometheus", instance="prom-b"}'
        values: "1+0x8 0+0x52"
    alert_rule_test:
      - eval_time: 2m
        alertname: PrometheusReplicaMissing
        exp_alerts: []
      # prom-b goes down at 2m; `for: 10m` is satisfied strictly after 12m.
      - eval_time: 13m
        alertname: PrometheusReplicaMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: monitoring
            exp_annotations:
              summary: "Une seule instance Prometheus active"
              description: >-
                Le modèle HA repose sur deux instances identiques. Il n'en reste qu'une : la supervision n'est plus redondante.

  - interval: 15s
    name: AlertmanagerClusterDegraded fires below 3 members
    input_series:
      - series: 'alertmanager_cluster_members{instance="am-1"}'
        values: "3+0x8 2+0x40"
    alert_rule_test:
      - eval_time: 2m
        alertname: AlertmanagerClusterDegraded
        exp_alerts: []
      - eval_time: 8m
        alertname: AlertmanagerClusterDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              component: monitoring
              instance: am-1
            exp_annotations:
              summary: "Cluster Alertmanager dégradé (2 membres)"
              description: >-
                Moins de 3 membres dans le cluster gossip. La déduplication fonctionne encore, mais une perte supplémentaire créerait des tickets GLPI en double.
