---
# =============================================================================
# Alertmanager 0.28 — routing, grouping, inhibition (CDC §7.6).
#
# Rendered by scripts/lib/render.py (${DOMAIN}, ${SMTP_*}) and mounted
# read-only on the THREE replicas, which form a gossip cluster.
#
# Its job here is not "send a notification". It is to turn a storm of raw
# alerts into a small number of ACTIONABLE tickets:
#   - deduplicate the two identical Prometheus instances;
#   - group related alerts so one incident is one ticket;
#   - INHIBIT the consequences of a root cause, so losing a node opens one
#     ticket instead of a dozen.
#
# Documented section by section in docs/04-composants/alertmanager.md.
# =============================================================================

global:
  # How long an alert stays firing after Prometheus stops sending it. It must
  # be at least 2-3 scrape/evaluation intervals (15 s here) or a single missed
  # evaluation would mark an alert resolved and close the GLPI ticket, only to
  # reopen it seconds later.
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "${SMTP_FROM}"
  smtp_require_tls: false

# =============================================================================
# Routing
# =============================================================================
route:
  # --- Grouping ------------------------------------------------------------
  # `alertname` + `node` + `component`: alerts of the same kind, on the same
  # node, about the same component become ONE notification.
  #
  # `node` in the key is what makes "node1 disk full" and "node2 disk full"
  # two separate tickets — they are two separate problems needing two separate
  # actions. Grouping only on `alertname` would merge them into one ticket
  # that gets closed when either is fixed.
  group_by: ["alertname", "node", "component"]

  # 30 s before the first notification of a new group: enough for the related
  # alerts of the same incident to arrive and be grouped, short enough that a
  # critical alert is not delayed meaningfully.
  group_wait: 30s

  # 5 min before notifying about NEW alerts added to an existing group.
  group_interval: 5m

  # 4 h between repeat notifications for a still-firing alert. Longer than the
  # usual default because a repeat creates a GLPI follow-up: too short and the
  # ticket fills with noise, too long and a forgotten incident stays silent.
  repeat_interval: 4h

  # Everything goes to GLPI. That is the point of ADR-0009: an alert that does
  # not become a ticket is an alert nobody owns.
  receiver: glpi

  routes:
    # -----------------------------------------------------------------------
    # Watchdog: a permanently-firing alert whose ABSENCE means the monitoring
    # chain is broken. It must never create a ticket, so it is routed to a
    # null receiver first.
    # -----------------------------------------------------------------------
    - matchers:
        - alertname = "Watchdog"
      receiver: "null"
      group_wait: 0s
      repeat_interval: 1h

    # -----------------------------------------------------------------------
    # Critical alerts: same receiver, but notified faster and repeated more
    # often. `continue: true` so they ALSO fall through to the e-mail route
    # below when SMTP is configured.
    # -----------------------------------------------------------------------
    - matchers:
        - severity = "critical"
      receiver: glpi
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
      continue: true

    # -----------------------------------------------------------------------
    # Optional e-mail, active only when SMTP_HOST is set in .env. The matcher
    # on `severity` keeps low-value alerts out of an inbox.
    # -----------------------------------------------------------------------
    - matchers:
        - severity =~ "critical|warning"
      receiver: email
      continue: false

# =============================================================================
# Inhibition — the single most valuable feature here
#
# When a node dies, EVERYTHING on it alerts at once: node-exporter, cAdvisor,
# the Galera member, the Cassandra member, the Elasticsearch member, the
# Traefik instance, the CrowdSec agent… A dozen alerts, one incident, one
# action. Without inhibition that becomes a dozen GLPI tickets and the operator
# has to work out which one is the cause.
#
# `equal:` is the crucial part: it lists the labels that must MATCH between the
# source and the target. Get it wrong and either nothing is inhibited, or an
# alert on a healthy node is silenced by an incident on another one — which is
# far worse than no inhibition at all.
# =============================================================================
inhibit_rules:
  # --- 1. A dead node silences everything ON that node -------------------
  - source_matchers:
      - alertname = "NodeDown"
    target_matchers:
      - severity =~ "critical|warning"
    equal: ["node"]
    # Only alerts carrying the SAME `node` label are inhibited. An alert with
    # no `node` label (a blackbox probe through the VIP, for instance) is NOT
    # inhibited — and that is correct: "GLPI is down" remains meaningful even
    # while a node is down, because it tells us the failover did not work.

  # --- 2. A lost VIP silences the service probes ---------------------------
  # If the VIP does not answer, every blackbox HTTP probe fails as a
  # consequence. One cause, one ticket.
  - source_matchers:
      - alertname = "VipUnreachable"
    target_matchers:
      - alertname =~ "GLPIDown|GrafanaDown|KibanaDown|MinIODown|GLPISlow"
    equal: []
    # Empty `equal`: these alerts have no label in common with VipUnreachable
    # (they are probes of different targets), yet the causal link is total —
    # nothing at all is reachable without the VIP.

  # --- 3. Critical silences warning of the same alert ----------------------
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "node", "component"]
    # Example: NodeDiskFull (critical) silences NodeDiskFillingUp (warning) on
    # the same mount of the same node.

  # --- 4. Lost quorum silences the size warning ----------------------------
  - source_matchers:
      - alertname = "GaleraQuorumLost"
    target_matchers:
      - alertname = "GaleraClusterSizeLt3"
    equal: []

  - source_matchers:
      - alertname = "CassandraQuorumAtRisk"
    target_matchers:
      - alertname = "CassandraNodeDown"
    equal: []

  # --- 5. A red cluster silences the yellow warning ------------------------
  - source_matchers:
      - alertname = "ESClusterRed"
    target_matchers:
      - alertname =~ "ESClusterYellow|ESDiskWatermark"
    equal: []

  # --- 6. A down database silences its own symptoms ------------------------
  - source_matchers:
      - alertname = "MariaDBDown"
    target_matchers:
      - alertname =~ "GaleraNotSynced|GaleraFlowControlPaused"
    equal: ["instance"]

  # --- 7. MinIO down silences the backup failures it causes ----------------
  # Without this, one MinIO outage would open a ticket per backup job.
  - source_matchers:
      - alertname = "MinIODown"
    target_matchers:
      - alertname =~ "BackupFailed|BackupTooOld|ESSnapshotFailed"
    equal: []

  # --- 8. Traefik down silences its own 5xx --------------------------------
  - source_matchers:
      - alertname = "TraefikDown"
    target_matchers:
      - alertname = "TraefikHigh5xx"
    equal: ["node"]

# =============================================================================
# Receivers
# =============================================================================
receivers:
  # --- The whole point: alerts become GLPI tickets (ADR-0009) --------------
  - name: glpi
    webhook_configs:
      - url: "http://alert2glpi:8080/alert"
        # `send_resolved: true` is what closes the loop: alert2glpi turns a
        # `resolved` notification into a "Résolu" status on the ticket. Without
        # it, tickets would only ever be created and someone would have to
        # close them by hand — which nobody does.
        send_resolved: true
        max_alerts: 0        # never truncate a batch: every alert must be seen
        http_config:
          # No redirects: alert2glpi answers 200 or it does not. Following a
          # redirect would mean posting an alert to an unexpected URL.
          follow_redirects: false
          # HTTP/2 buys nothing for a handful of small POSTs and adds a
          # negotiation step to a path that must be as simple as possible.
          enable_http2: false

  # --- Optional e-mail ------------------------------------------------------
  # Alertmanager REFUSES to start on an `email_configs` entry with an empty
  # `to`, so this receiver and the route above it are REMOVED at render time by
  # scripts/lib/render-alertmanager.py when SMTP_HOST or ALERT_EMAIL_TO is
  # unset. They are declared in full here so that this file stays a complete,
  # readable, lintable document.
  - name: email
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true
        headers:
          Subject: '[Dockerwarts] {{ .Status | toUpper }} — {{ .CommonLabels.alertname }}'
        html: |
          <h2>{{ .Status | toUpper }} — {{ .CommonLabels.alertname }}</h2>
          {{ range .Alerts }}
          <hr>
          <p><b>{{ .Annotations.summary }}</b></p>
          <p>{{ .Annotations.description }}</p>
          <ul>
            {{ range .Labels.SortedPairs }}<li>{{ .Name }} = {{ .Value }}</li>{{ end }}
          </ul>
          {{ if .Annotations.runbook }}<p><a href="{{ .Annotations.runbook }}">Runbook</a></p>{{ end }}
          {{ if .Annotations.dashboard }}<p><a href="{{ .Annotations.dashboard }}">Dashboard</a></p>{{ end }}
          {{ end }}

  # --- Null: for alerts that must exist but never notify -------------------
  - name: "null"

# =============================================================================
# Templates
#
# None: alert2glpi receives the raw webhook v4 JSON and builds the ticket
# itself from the annotations (ADR-0009). Formatting in Alertmanager as well
# would split the presentation logic across two components.
# =============================================================================
templates: []
