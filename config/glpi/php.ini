; =============================================================================
; GLPI — PHP overrides.
;
; Mounted read-only at /usr/local/etc/php/conf.d/zz-dockerwarts.ini on both
; glpi-web and glpi-cron. The `zz-` prefix guarantees it is loaded LAST, so it
; wins over the image's own defaults.
;
; Documented in docs/04-composants/glpi.md.
; =============================================================================

; --- Limits GLPI itself checks at installation -------------------------------
; GLPI refuses to install, or warns permanently, below these values. They are
; the documented minima, not guesses.
memory_limit = 256M
max_execution_time = 600
; 600 s: a GLPI inventory import or a large plugin installation genuinely takes
; minutes. The default of 30 s makes them fail halfway, leaving partial data.

; --- Uploads -----------------------------------------------------------------
; Attachments land on NFS. 64 MB is generous for a ticketing system and keeps a
; single upload from filling the export.
upload_max_filesize = 64M
post_max_size = 64M
; post_max_size must be >= upload_max_filesize, or PHP silently drops the file
; and GLPI reports an empty attachment with no error.
max_file_uploads = 20

; --- Sessions ----------------------------------------------------------------
; Sessions stay on the local filesystem of each replica, which is why Traefik
; pins a user to one replica with the `glpi_srv` sticky cookie (stacks/apps.yml).
;
; They are deliberately NOT on NFS: session files are written on every single
; request, and NFS round trips would dominate the response time. The trade-off
; is that losing a replica logs its users out — 30 seconds of inconvenience
; against a permanent latency cost.
session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
; use_strict_mode: PHP refuses a session id it did not generate itself, which
; closes session-fixation attacks.

; --- Timezone ----------------------------------------------------------------
; GLPI warns if this is unset, and timestamps would drift from the ones in the
; tickets alert2glpi creates.
date.timezone = "Europe/Paris"

; --- Hardening ---------------------------------------------------------------
expose_php = Off
; No `X-Powered-By: PHP/8.x` header. Traefik strips it too (security-headers
; middleware); doing it at the source costs nothing.
display_errors = Off
display_startup_errors = Off
; Never render a stack trace to a browser: it leaks paths, versions and
; sometimes credentials.
log_errors = On
error_log = /dev/stderr
; To stderr, so Fluent Bit collects PHP errors like any other container log
; instead of leaving them in a file nobody reads.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Functions GLPI does not need and that turn a file-write vulnerability into
; remote code execution.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; --- OPcache -----------------------------------------------------------------
; GLPI is a large PHP application; without OPcache every request recompiles
; thousands of files. This is the single largest performance factor.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
; validate_timestamps stays ON: a plugin installed through the marketplace
; changes files on disk, and with it OFF those changes would only appear after
; a container restart.
