; =============================================================================
; Grafana 12 — configuration.
;
; Rendered by scripts/lib/render.py (${DOMAIN}) and mounted read-only at
; /etc/grafana/grafana.ini.
;
; Secrets are NOT here: config/common/secrets-entrypoint.sh turns
; GF_SECURITY_ADMIN_PASSWORD_FILE and friends into the environment variables
; Grafana reads. A Swarm `config` object is readable with `docker config
; inspect` from any manager; a `secret` is not.
;
; Documented section by section in docs/04-composants/grafana.md.
; =============================================================================

[server]
protocol = http
http_port = 3000
domain = grafana.${DOMAIN}
; root_url must be the PUBLIC url: Grafana builds absolute links (share, alert
; notifications, OAuth redirects) from it. Wrong here means links that work for
; the person who made them and 404 for everyone else.
root_url = https://grafana.${DOMAIN}
enforce_domain = false
; Traefik terminates TLS; Grafana speaks plain HTTP on the `edge` overlay.
enable_gzip = true

; =============================================================================
; Database — THE setting that makes Grafana genuinely HA (ADR-0005)
;
; With the default SQLite, each of the two replicas would have its own state:
; a user would be logged out on every other request, dashboards saved on one
; replica would be invisible on the other, and alert state would be duplicated.
;
; Pointing both replicas at the shared Galera database through db-proxy makes
; them interchangeable — which is what "2 replicas" is supposed to mean.
; =============================================================================
[database]
type = mysql
host = db-proxy:3306
name = grafana
user = grafana
; password comes from GF_DATABASE_PASSWORD (secrets-entrypoint.sh)
max_open_conn = 30
max_idle_conn = 10
conn_max_lifetime = 14400
; 4 hours: shorter than any connection timeout on the HAProxy path, so a
; connection is recycled before it can be dropped underneath a query.

[session]
provider = mysql
; Sessions in the shared database too, for the same reason. This is what lets
; a user keep their session when Swarm reschedules a replica.

; =============================================================================
; Security
; =============================================================================
[security]
; admin_user / admin_password come from the environment (secrets).
admin_user = admin
disable_gravatar = true
; No outbound call to gravatar.com for every user avatar.
cookie_secure = true
cookie_samesite = lax
strict_transport_security = true
strict_transport_security_max_age_seconds = 31536000
content_security_policy = true
x_content_type_options = true
x_xss_protection = true
; secret_key comes from GF_SECURITY_SECRET_KEY. It signs cookies and encrypts
; datasource passwords in the database: it MUST be identical on both replicas,
; or a user authenticated on one is rejected by the other. It is a Docker
; secret (dw_grafana_secret_key) for exactly that reason.

[users]
allow_sign_up = false
; No self-registration: accounts are created by the administrator.
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark
; Europe/Paris everywhere, so a timestamp on a dashboard matches the one in
; the GLPI ticket and in Kibana.
default_timezone = Europe/Paris

[auth]
disable_login_form = false
disable_signout_menu = false
; No anonymous access: Grafana exposes infrastructure topology and is reachable
; without an IP allowlist (it is a user-facing service, like GLPI).
[auth.anonymous]
enabled = false

; =============================================================================
; Alerting — deliberately OFF
;
; Alertmanager is the single source of alerts (ADR-0009). Grafana's own
; alerting would create a SECOND alerting engine with its own rules, its own
; state and its own notifications — and nothing would guarantee the two agree.
; A ticket raised by one and not the other is worse than no alert at all.
;
; Grafana still DISPLAYS the Alertmanager alerts through its datasource.
; =============================================================================
[unified_alerting]
enabled = false
[alerting]
enabled = false

; =============================================================================
; Provisioning — everything as code
; =============================================================================
[paths]
provisioning = /etc/grafana/provisioning

[dashboards]
; Rescan the dashboard directory every 30 s so a redeploy of the config picks
; up changes without a restart.
min_refresh_interval = 10s

; =============================================================================
; Telemetry — off
; =============================================================================
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

; =============================================================================
; Logs
; =============================================================================
[log]
mode = console
level = warn
; `warn` and not `info`: Grafana logs every HTTP request at info, including the
; /api/health probe every 15 s. At warn the log stays readable.
[log.console]
format = json
; JSON, so Fluent Bit's docker parser decodes the fields instead of storing an
; opaque string.

[metrics]
enabled = true
; /metrics scraped by Prometheus over the `monitoring` overlay.

[explore]
enabled = true
; Explore is how an operator pivots from a dashboard panel to the raw logs in
; Elasticsearch. It is the main reason Grafana and Kibana coexist usefully.
