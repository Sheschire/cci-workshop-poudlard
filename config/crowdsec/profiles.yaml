# =============================================================================
# CrowdSec — remediation profiles (what happens when a scenario fires).
#
# Mounted read-only at /etc/crowdsec/profiles.yaml on the LAPI.
#
# CrowdSec separates *detection* (scenarios, run by the agents) from
# *remediation* (decisions, taken by the LAPI, applied by the bouncers). This
# file is the remediation half: it walks the profiles top to bottom and stops
# at the first one that matches unless `on_success: continue`.
#
# Documented in docs/04-composants/crowdsec.md.
# =============================================================================
---

# -----------------------------------------------------------------------------
# 1. Never ban ourselves.
#
# First and absolute. The cluster subnet and the administration workstation
# generate exactly the traffic patterns the scenarios look for: the smoke test
# hammers every URL, `make chaos` produces bursts of 5xx, the blackbox exporter
# probes every 15 s. Without this profile the platform bans its own monitoring
# — and, worse, the operator, mid-incident.
#
# The `crowdsec` middleware ALSO lists CLUSTER_CIDR in `clientTrustedIPs`:
# belt and braces, because the two mechanisms fail differently.
# -----------------------------------------------------------------------------
name: dockerwarts/whitelist
filters:
  - >-
    evt.Overflow.Alert.Source.Scope == "Ip" &&
    (
      evt.Overflow.Alert.Source.Value startsWith "192.168.56." ||
      evt.Overflow.Alert.Source.Value startsWith "10.20." ||
      evt.Overflow.Alert.Source.Value startsWith "172.20." ||
      evt.Overflow.Alert.Source.Value startsWith "127."
    )
# No `decisions:` block → detected, recorded, but never acted upon. The alert
# still shows up in `cscli alerts list` and on the Grafana dashboard, which is
# what makes a misfiring probe visible instead of silent.
on_success: break

---
# -----------------------------------------------------------------------------
# 2. Credential attacks — long ban.
#
# Brute force against the GLPI or Grafana login, and SSH brute force. These are
# unambiguous: a legitimate user does not fail ten authentications in a row.
# 4 hours, and the counter starts again on the next attempt.
#
# This is the profile exercised by acceptance criterion 1.4 / CDC §6.3
# (10 failed GLPI logins → automatic ban).
# -----------------------------------------------------------------------------
name: dockerwarts/bruteforce
filters:
  - >-
    Alert.Remediation == true &&
    (
      Alert.GetScenario() contains "bf" ||
      Alert.GetScenario() contains "bruteforce" ||
      Alert.GetScenario() contains "sshd"
    )
decisions:
  - type: ban
    duration: 4h
on_success: break

---
# -----------------------------------------------------------------------------
# 3. Known CVE exploitation attempts — very long ban.
#
# `crowdsecurity/http-cve` matches requests targeting published vulnerabilities.
# There is no legitimate reason for such a request to reach this platform, so
# the ban is deliberately long: this traffic is automated, and the source will
# come back.
# -----------------------------------------------------------------------------
name: dockerwarts/cve
filters:
  - Alert.Remediation == true && Alert.GetScenario() contains "http-cve"
decisions:
  - type: ban
    duration: 24h
on_success: break

---
# -----------------------------------------------------------------------------
# 4. Scanning and probing — short ban.
#
# Path enumeration, aggressive crawling, 404 storms. Sometimes a
# misconfiguration rather than an attack, so the ban is short enough that an
# honest mistake self-heals before anyone opens a ticket.
# -----------------------------------------------------------------------------
name: dockerwarts/scan
filters:
  - >-
    Alert.Remediation == true &&
    (
      Alert.GetScenario() contains "http-probing" ||
      Alert.GetScenario() contains "http-crawl" ||
      Alert.GetScenario() contains "http-bad-user-agent" ||
      Alert.GetScenario() contains "http-path-traversal"
    )
decisions:
  - type: ban
    duration: 1h
on_success: break

---
# -----------------------------------------------------------------------------
# 5. Default — anything else that asked for remediation.
#
# Catch-all so that a newly installed collection produces a real decision
# instead of being silently ignored.
# -----------------------------------------------------------------------------
name: dockerwarts/default
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 2h
on_success: break
