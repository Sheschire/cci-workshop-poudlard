---
# =============================================================================
# Blackbox exporter — availability from the USER's point of view (CDC §7.6).
#
# Rendered by scripts/lib/render.py and mounted read-only at
# /config/blackbox.yml.
#
# Every other exporter measures the platform from the INSIDE. These probes go
# through the VIP, over TLS, exactly like a browser would. They are the only
# measurements that catch a broken Traefik router, an expired certificate, or a
# VIP that failed to move — failures that leave every internal metric green.
#
# Documented in docs/05-monitoring.md.
# =============================================================================

modules:
  # ---------------------------------------------------------------------------
  # http_2xx — generic HTTPS probe
  # ---------------------------------------------------------------------------
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: false
      # No redirects: a 302 to a login page is NOT the service working. GLPI
      # and Grafana both redirect anonymous users, so the probed URLs are
      # health endpoints that answer 200 without authentication.
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      tls_config:
        # The internal CA, so an EXPIRED or WRONG certificate makes the probe
        # fail. `insecure_skip_verify: true` would be the easy way out and
        # would silently defeat the CertificateExpiringSoon alert, which reads
        # `probe_ssl_earliest_cert_expiry` — a value only produced when the
        # handshake is actually validated.
        insecure_skip_verify: false
        ca_file: /run/secrets/dw_ca_cert
      headers:
        User-Agent: "dockerwarts-blackbox/1.0"
        # Identifiable, so these probes are recognisable in the Traefik access
        # log and in the CrowdSec alerts they would otherwise trigger.

  # ---------------------------------------------------------------------------
  # http_2xx_glpi — GLPI needs a content check, not just a status code
  #
  # A maintenance page, a Traefik error page and a PHP fatal error can all
  # return 200. Requiring "GLPI" in the body is what makes this probe mean
  # "GLPI is serving", not "something answered".
  # ---------------------------------------------------------------------------
  http_2xx_glpi:
    prober: http
    timeout: 15s
    # 15 s and not 10: GLPI's first page after a cold start is genuinely slow,
    # and a probe timeout would open a false GLPIDown ticket during a restart.
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      # Here redirects ARE followed: GLPI sends anonymous users to
      # /front/central.php, and the login page is a perfectly valid sign that
      # the application is up.
      fail_if_body_not_matches_regexp:
        - "(?i)glpi"
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: false
        ca_file: /run/secrets/dw_ca_cert
      headers:
        User-Agent: "dockerwarts-blackbox/1.0"

  # ---------------------------------------------------------------------------
  # tcp_connect — internal services with no HTTP endpoint
  # ---------------------------------------------------------------------------
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      # No TLS: these are overlay-internal endpoints (db-proxy, es-1,
      # cassandra-1) reached over the `data` network, which is itself
      # IPsec-encrypted (ADR-0007).

  # ---------------------------------------------------------------------------
  # icmp — THE probe of the platform
  #
  # If the VIP does not answer a ping, nothing is reachable, whatever every
  # other metric says. This feeds VipUnreachable, the alert with the shortest
  # `for:` in the whole ruleset (30 s).
  # ---------------------------------------------------------------------------
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      # Requires CAP_NET_RAW on the container — the single capability added
      # back in stacks/monitoring.yml, and the reason it is added.

  # ---------------------------------------------------------------------------
  # http_2xx_any — accepts any 2xx/3xx
  #
  # For endpoints whose exact code is not the point (a console that answers 307
  # to /). Deliberately separate from http_2xx so that loosening one probe
  # cannot loosen them all by accident.
  # ---------------------------------------------------------------------------
  http_2xx_any:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 201, 204, 301, 302, 307, 308]
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: false
        ca_file: /run/secrets/dw_ca_cert
