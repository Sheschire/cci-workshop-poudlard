# =============================================================================
# backup-metrics — nginx serving the backup textfile metrics (CDC §7.7).
#
# The backup jobs are one-shot containers scheduled by swarm-cronjob: they
# start, work, publish, exit. Prometheus cannot scrape a container that is not
# running, and the pushgateway pattern was rejected (a pushed metric survives
# the job that produced it and lies forever). The jobs therefore write a
# textfile-format .prom onto the shared NFS directory, and this nginx serves
# that single file. Prometheus scrapes a stable, always-up target; the metric
# itself carries the freshness (backup_last_success_timestamp), which is
# exactly what BackupTooOld measures.
#
# Deployed as `backup-metrics` in stacks/backup.yml, scrape job `backup`.
# =============================================================================

# One worker: this serves a file of a few hundred bytes once a minute.
worker_processes 1;

# The container runs as 65534:65534 with cap_drop [ALL] — it can write nowhere
# but /tmp (a tmpfs) and cannot bind a port below 1024. Every path nginx needs
# to write is therefore moved under /tmp, and it listens on 8080.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Access logs off on purpose: one scrape a minute, forever, would be pure
    # noise in Elasticsearch. Errors still go to stderr and are collected.
    access_log off;

    # NFS reads are the cost here; sendfile keeps them out of user space.
    sendfile on;
    server_tokens off;

    server {
        listen 8080;
        server_name _;

        # ---------------------------------------------------------------------
        # /metrics — the file itself.
        #
        # `alias` and not `root`: the URI is /metrics and the file is
        # /srv/metrics/backup.prom, so no path mapping applies.
        #
        # Cache-Control no-store: the file changes at unpredictable times and a
        # cached copy would make a failed backup look fresh.
        # ---------------------------------------------------------------------
        location = /metrics {
            alias /srv/metrics/backup.prom;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            # Before the first job has ever run the file does not exist. Serving
            # a 404 would make the Prometheus target `up == 0` and fire
            # PrometheusTargetMissing — a monitoring failure, which is the wrong
            # diagnosis. Serving an empty exposition keeps the target UP and
            # lets BackupNeverRan say the true thing: no backup has run yet.
            error_page 404 = @no_metrics;
        }

        location @no_metrics {
            default_type text/plain;
            return 200 "# no backup has published a metric yet\n";
        }

        # Healthcheck target: proves nginx answers, independently of whether
        # any backup has run.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Nothing else is served. The NFS export holds only this file today,
        # but an explicit 404 keeps it that way if it ever holds more.
        location / {
            return 404;
        }
    }
}
