# =============================================================================
# Fluent Bit 3.x — log collection (CDC §7.4).
#
# Rendered by scripts/lib/render.py and mounted read-only at
# /fluent-bit/etc/fluent-bit.conf. Global service: one task per node, each
# collecting only its own node's logs.
#
# Why Fluent Bit and not the Docker `fluentd` log driver
# ------------------------------------------------------
# With the fluentd driver, a container's stdout write BLOCKS when the collector
# is unavailable — a Fluent Bit incident would then stall the applications it
# is supposed to observe. Here Docker writes json-file (daemon.json) and Fluent
# Bit *tails* those files: a collection outage costs logs, never a service.
#
# Documented section by section in docs/04-composants/fluent-bit.md.
# =============================================================================

[SERVICE]
    Flush                     5
    # 5 s between flushes: a good trade between Elasticsearch bulk efficiency
    # (bigger batches) and how fresh the logs look in Kibana.
    Daemon                    Off
    Log_Level                 info
    Parsers_File              parsers.conf

    # --- Filesystem buffering -------------------------------------------------
    # THE setting that makes this collector survive an Elasticsearch outage.
    # With memory-only buffering, an ES restart loses everything in flight.
    # With a filesystem store, chunks are written to a local volume and replayed
    # when ES returns.
    storage.path              /var/log/flb-storage/
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 64M
    # How much of the on-disk backlog may be held in memory while replaying.
    storage.metrics           on

    # --- Metrics --------------------------------------------------------------
    # Scraped by Prometheus on :2020 over the `monitoring` overlay.
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    HC_Errors_Count           5
    HC_Retry_Failure_Count    5
    HC_Period                 60

# =============================================================================
# INPUT 1 — container logs
#
# Docker writes one json-file per container (daemon.json). Tailing them gives
# every container's stdout/stderr with no cooperation from the application.
# =============================================================================
[INPUT]
    Name              tail
    Alias             containers
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    # Exclude Fluent Bit's own container: it would log about logging, and any
    # error message would be re-ingested and re-fail — an infinite loop.
    Exclude_Path      /var/lib/docker/containers/*/*fluent-bit*-json.log
    Parser            docker
    # Position database on a local volume: after a restart, tailing resumes
    # where it stopped instead of re-ingesting every file from the beginning.
    DB                /var/log/flb-storage/containers.db
    DB.Sync           normal
    Mem_Buf_Limit     32M
    Skip_Long_Lines   On
    Refresh_Interval  5
    storage.type      filesystem
    # A container ID is only in the FILE PATH, not in the JSON. This exposes it
    # as a field so the Lua filter can resolve it to a Swarm service name.
    Path_Key          log_file_path

# --- Java stack traces --------------------------------------------------------
# Cassandra and Elasticsearch emit exceptions across dozens of lines. Without
# this, each line becomes a separate document and the trace is unreadable and
# unsearchable.
[FILTER]
    Name                  multiline
    Match                 docker.*
    multiline.key_content log
    multiline.parser      java_stacktrace, go, python

# =============================================================================
# INPUT 2 — Traefik access log
#
# The same file the CrowdSec agent reads. Both tail it; logrotate uses
# `copytruncate` (Ansible role `common`) so the inode is preserved and neither
# reader loses its position.
# =============================================================================
[INPUT]
    Name              tail
    Alias             traefik
    Tag               traefik.access
    Path              /var/log/traefik/access.log
    Parser            json
    DB                /var/log/flb-storage/traefik.db
    DB.Sync           normal
    Mem_Buf_Limit     16M
    Skip_Long_Lines   On
    Refresh_Interval  5
    storage.type      filesystem

# =============================================================================
# INPUT 3 — systemd journal
#
# Only the three units that matter operationally. Reading the whole journal
# would multiply the volume for no benefit.
#   docker      container lifecycle, image pulls, scheduling
#   keepalived  MASTER/BACKUP transitions — the evidence for the measured VIP
#               failover time in docs/06-haute-disponibilite.md
#   ssh         connections and failures, cross-checked with CrowdSec
# =============================================================================
[INPUT]
    Name              systemd
    Alias             journal
    Tag               system.*
    Path              /var/log/journal
    Systemd_Filter    _SYSTEMD_UNIT=docker.service
    Systemd_Filter    _SYSTEMD_UNIT=keepalived.service
    Systemd_Filter    _SYSTEMD_UNIT=ssh.service
    Systemd_Filter_Type Or
    DB                /var/log/flb-storage/journal.db
    Read_From_Tail    On
    # On first start, read only new entries: ingesting weeks of pre-existing
    # journal would flood a brand-new cluster and distort the retention window.
    Strip_Underscores On
    Mem_Buf_Limit     16M
    storage.type      filesystem

# =============================================================================
# FILTERS
# =============================================================================

# --- Swarm metadata -----------------------------------------------------------
# Docker's json-file contains only the raw message: no service name, no stack,
# no task. Without enrichment a log line cannot be attributed to a service,
# which makes the whole collection nearly useless.
#
# The Lua filter reads the container's own config.v2.json to resolve
# <container-id> → service / stack / task. See docker-metadata.lua.
[FILTER]
    Name    lua
    Match   docker.*
    script  /fluent-bit/etc/docker-metadata.lua
    call    add_docker_metadata

# --- Node name ----------------------------------------------------------------
# Which node produced the line. Injected from the Swarm-provided
# {{.Node.Hostname}} environment variable (see stacks/data.yml).
[FILTER]
    Name   record_modifier
    Match  *
    Record node_name ${NODE_NAME}

# --- Field naming -------------------------------------------------------------
# Elasticsearch data streams REQUIRE a field named `@timestamp`. The Docker
# parser produces `time`; renaming here rather than in the parser keeps the
# parser reusable.
[FILTER]
    Name          modify
    Match         docker.*
    Rename        log message
    Rename        log_file_path container_path
    Remove        _p
    # `_p` is Fluent Bit's internal partial-line marker: useless once the
    # multiline filter has reassembled the record.

[FILTER]
    Name          modify
    Match         traefik.access
    Rename        time @timestamp
    Rename        StartUTC @timestamp_traefik
    Remove        request_Authorization
    Remove        request_Cookie
    # Belt and braces: Traefik already drops these (accessLog.fields), but a
    # configuration mistake there must not turn into credentials in an index
    # that Grafana and Kibana expose broadly.

# --- Log level ----------------------------------------------------------------
# Normalise the level so the "errors per service" panel works across services
# that each spell it differently.
[FILTER]
    Name   lua
    Match  docker.*
    script /fluent-bit/etc/docker-metadata.lua
    call   normalize_level

# =============================================================================
# OUTPUTS — one data stream per source (CDC §7.4)
# =============================================================================

# Shared settings, repeated per output because Fluent Bit has no output
# inheritance:
#   Suppress_Type_Name On   mandatory on ES 8: mapping types are gone and
#                           sending one is a hard error
#   Retry_Limit False       retry forever. Combined with the filesystem
#                           buffer, this is what makes an ES outage lossless
#   Replace_Dots On         a dot in a field name would create an unwanted
#                           object hierarchy in the mapping

[OUTPUT]
    Name                 es
    Alias                es_docker
    Match                docker.*
    Host                 es-1
    Port                 9200
    # A single host: Fluent Bit's `es` output has no multi-host failover. es-1
    # going down stops shipping from every node — accepted, because the
    # filesystem buffer replays everything once it returns, and the alternative
    # (a load balancer for ES) would add a component for a lossless failure.
    HTTP_User            fluentbit
    HTTP_Passwd          ${ES_FLUENTBIT_PASSWORD}
    tls                  Off
    Suppress_Type_Name   On
    Replace_Dots         On
    Retry_Limit          False
    Trace_Error          On
    storage.total_limit_size 512M
    Compress             gzip
    # --- data stream ---
    Index                logs-docker
    Type                 _doc

[OUTPUT]
    Name                 es
    Alias                es_traefik
    Match                traefik.access
    Host                 es-1
    Port                 9200
    HTTP_User            fluentbit
    HTTP_Passwd          ${ES_FLUENTBIT_PASSWORD}
    tls                  Off
    Suppress_Type_Name   On
    Replace_Dots         On
    Retry_Limit          False
    Trace_Error          On
    storage.total_limit_size 256M
    Compress             gzip
    Index                logs-traefik
    Type                 _doc

[OUTPUT]
    Name                 es
    Alias                es_system
    Match                system.*
    Host                 es-1
    Port                 9200
    HTTP_User            fluentbit
    HTTP_Passwd          ${ES_FLUENTBIT_PASSWORD}
    tls                  Off
    Suppress_Type_Name   On
    Replace_Dots         On
    Retry_Limit          False
    Trace_Error          On
    storage.total_limit_size 128M
    Compress             gzip
    Index                logs-system
    Type                 _doc
