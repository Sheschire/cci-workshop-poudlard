# =============================================================================
# Fluent Bit — parsers (CDC §7.4).
#
# Mounted read-only at /fluent-bit/etc/parsers.conf.
#
# A parser turns a raw line into a structured record. Only the parsers this
# platform actually uses are declared: an unused parser is a maintenance
# liability, and Fluent Bit ships plenty of them upstream anyway.
#
# Documented in docs/04-composants/fluent-bit.md.
# =============================================================================

# -----------------------------------------------------------------------------
# docker — Docker's json-file format.
#
# Each line of /var/lib/docker/containers/<id>/<id>-json.log is a JSON object:
#   {"log":"the message\n","stream":"stdout","time":"2026-09-07T10:00:00.123456789Z"}
#
# Time_Keep On: the ORIGINAL timestamp is kept as a field as well as being used
# as the record time. Without it, a log replayed from the filesystem buffer
# after an Elasticsearch outage would be indexed with its replay time, and the
# whole outage window would collapse into a single second on the dashboards.
# -----------------------------------------------------------------------------
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
    # Decode the embedded message when a service already logs JSON (Traefik,
    # Elasticsearch, Kibana, GLPI): the fields become first-class instead of an
    # opaque string that nobody can aggregate on.
    Decode_Field_As   json    log    do_next
    Decode_Field_As   escaped log

# -----------------------------------------------------------------------------
# json — plain JSON, one object per line. Used for the Traefik access log.
#
# Traefik's `StartUTC` is RFC3339 with nanoseconds.
# -----------------------------------------------------------------------------
[PARSER]
    Name        json
    Format      json
    Time_Key    StartUTC
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# -----------------------------------------------------------------------------
# syslog-rfc3164 — the host's /var/log/auth.log and /var/log/kern.log.
#
# Not used by an INPUT today (CrowdSec reads those files directly), kept
# because the `systemd` input can emit RFC3164-shaped records for units that
# log through syslog rather than the journal API.
# -----------------------------------------------------------------------------
[PARSER]
    Name        syslog-rfc3164
    Format      regex
    Regex       /^\<(?<pri>[0-9]+)\>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$/
    Time_Key    time
    Time_Format %b %d %H:%M:%S
    Time_Keep   On

# =============================================================================
# Multiline parsers
#
# A Java exception is dozens of lines that belong to ONE event. Without
# reassembly each line becomes its own document: the stack trace is unreadable,
# unsearchable, and inflates the document count by an order of magnitude during
# an incident — exactly when the logs matter most.
# =============================================================================

# -----------------------------------------------------------------------------
# java_stacktrace — Cassandra and Elasticsearch.
#
# `rule "start_state"` matches the first line of an event; every subsequent
# line matching a continuation rule is appended to it.
#
# Continuations are:
#   "    at com.example.Foo.bar(Foo.java:42)"   indented frames
#   "Caused by: java.lang.Exception"            chained causes
#   "    ... 17 more"                           elided frames
# -----------------------------------------------------------------------------
[MULTILINE_PARSER]
    Name          java_stacktrace
    Type          regex
    Flush_Timeout 2000
    # 2 s: an event is emitted at most 2 s after its last line, even if the
    # process died mid-trace. Longer would delay error visibility; shorter
    # would split slow traces in half.
    rule      "start_state"  "/^(INFO|WARN|ERROR|DEBUG|TRACE|FATAL|\[?\d{4}-\d{2}-\d{2})/"  "cont"
    rule      "cont"         "/^(\s+at\s|\s+\.\.\.\s|Caused by:|\s+Suppressed:|\t)/"        "cont"

# -----------------------------------------------------------------------------
# go — Traefik and CrowdSec panics.
# -----------------------------------------------------------------------------
[MULTILINE_PARSER]
    Name          go
    Type          regex
    Flush_Timeout 2000
    rule      "start_state"  "/^\S+/"                                  "cont"
    rule      "cont"         "/^(\s+|goroutine \d+|created by |\t)/"   "cont"

# -----------------------------------------------------------------------------
# python — alert2glpi and demo-producer.
#
# A Python traceback starts with "Traceback (most recent call last):" and ends
# with the exception line, which is NOT indented — hence the two continuation
# rules.
# -----------------------------------------------------------------------------
[MULTILINE_PARSER]
    Name          python
    Type          regex
    Flush_Timeout 2000
    rule      "start_state"  "/^Traceback \(most recent call last\):/"  "cont"
    rule      "cont"         "/^(\s+|\w+Error|\w+Exception|\w+Warning)/" "cont"
